<script>
(function(){
"use strict";
const D=window.__POV, L=window.__POVLIB;
const {buildGM,sampleGM,peakGM,AU,mulberry32,clamp,nf,romOf,hhmmss,$}=L;
const T=window.THREE;
if(!T){ $('#load').innerHTML='<div><span>Gagal memuat pustaka 3D. Periksa koneksi lalu muat ulang.</span></div>'; return; }
const G=9.80665;

/* ================================================================
   KERENTANAN BANGUNAN — kurva rapuh lognormal per bangunan
   kapasitas = median * exp(beta*z), z~N(0,1)  =>  bagian runtuh = kurva rapuh
   Guncangan: HAZUS URM/beton disetel utk non-rekayasa Indonesia
   Tsunami : kedalaman aliran perobohan (Koshimura dkk. 2009)
   ================================================================ */
const KELAS=[
  {medA:0.38, betA:0.65, medD:2.2, betD:0.45},
  {medA:0.46, betA:0.62, medD:3.6, betD:0.42},
  {medA:0.62, betA:0.58, medD:6.5, betD:0.40}
];
function gauss(rnd){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const pRuntuh=(pga,k)=>Phi(Math.log(pga/KELAS[k].medA)/KELAS[k].betA);

/* ketinggian permukiman bawaan (m dpl) — sel grid 1,96 km terlalu kasar untuk ini,
   jadi dipakai taksiran wajar per lokasi; pengguna bisa menggesernya */
const ELEV0={jakut:2,labuan:3,anyer:4,merak:4,pelabuhanratu:5,bakauheni:5,seribu:2,cilegon:6};
const LOOK={
  jakut:        {rumah:230, tinggi:[3.2,7,14,30],  palem:24, perahu:4,  pasir:0.18},
  labuan:       {rumah:160, tinggi:[3.2,4.5,7,11], palem:90, perahu:16, pasir:0.85},
  anyer:        {rumah:130, tinggi:[3.2,4.5,8,13], palem:105,perahu:10, pasir:0.9},
  merak:        {rumah:180, tinggi:[3.4,6,11,22],  palem:40, perahu:12, pasir:0.35},
  pelabuhanratu:{rumah:140, tinggi:[3.2,5,9,16],   palem:80, perahu:20, pasir:0.7},
  bakauheni:    {rumah:110, tinggi:[3.2,4.5,7,12], palem:85, perahu:14, pasir:0.8},
  seribu:       {rumah:70,  tinggi:[3.2,4,6,8],    palem:125,perahu:18, pasir:1.0},
  cilegon:      {rumah:200, tinggi:[4,8,15,26],    palem:30, perahu:6,  pasir:0.3}
};

/* ---------- penyaji ---------- */
const cv=$('#stage');
const renderer=new T.WebGLRenderer({canvas:cv,antialias:(window.devicePixelRatio||1)<2,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight,false);
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(innerWidth<innerHeight?80:62,innerWidth/innerHeight,0.15,3400);
const FOG_UDARA=new T.Color(0x9fb8c4), FOG_AIR=new T.Color(0x24606b), FOG_BADAI=new T.Color(0x6f8390);
scene.fog=new T.Fog(FOG_UDARA.getHex(),320,2400);
scene.background=new T.Color(FOG_UDARA.getHex());
const skyU={a:{value:new T.Color(0x2f5f88)},b:{value:new T.Color(0xb4c8d2)},k:{value:0}};
{
  const g=new T.SphereGeometry(2800,24,14);
  const m=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:skyU,
    vertexShader:'varying float vy;void main(){vy=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 a;uniform vec3 b;uniform float k;varying float vy;void main(){float t=clamp(vy*1.25+0.35,0.0,1.0);vec3 c=mix(b,a,t);c=mix(c,vec3(0.36,0.40,0.43),k*0.55);gl_FragColor=vec4(c,1.0);}'});
  scene.add(new T.Mesh(g,m));
}
const hemi=new T.HemisphereLight(0xcfe2ec,0x4a5535,0.85); scene.add(hemi);
const sun=new T.DirectionalLight(0xfff2e0,1.15); sun.position.set(-160,190,120); scene.add(sun);

/* seluruh dunia lokal ada dalam satu grup, agar TANAH BENAR-BENAR BERGESER saat gempa */
const world=new T.Group(); scene.add(world);

/* ---------- tanah: shader dengan geseran, riak gempa, dan retakan ---------- */
const SHORE=-40, CAM_Z=110;
const gU={uT:{value:0},uRip:{value:0},uFiss:{value:0},uSub:{value:0},
          fogColor:{value:new T.Color(FOG_UDARA.getHex())},fogNear:{value:320},fogFar:{value:2400},
          uSun:{value:new T.Vector3(-0.6,0.7,0.45).normalize()}};
const groundMat=new T.ShaderMaterial({uniforms:gU,vertexColors:true,
  vertexShader:[
    'uniform float uT,uRip,uFiss,uSub;',
    'varying vec3 vC; varying vec3 vN; varying float vFiss; varying float vDist;',
    'void main(){',
    '  vec3 p=position;',
    '  float env=uRip;',
    '  float rip=sin(p.z*0.05-uT*7.0)*0.7+sin(p.x*0.035+uT*4.3)*0.3;',
    '  p.y+=rip*env;',
    '  p.y-=uSub*smoothstep(-60.0,20.0,p.z);',        // amblesan permanen di daratan
    '  float f=abs(sin(p.x*0.21+sin(p.z*0.07)*3.0))*abs(sin(p.z*0.17+sin(p.x*0.05)*2.0));',
    '  vFiss=smoothstep(0.972,1.0,f)*uFiss*step(-38.0,p.z);',
    '  p.y-=vFiss*0.6;',
    '  vC=color; vN=normalize(normalMatrix*normal);',
    '  vec4 mv=modelViewMatrix*vec4(p,1.0); vDist=-mv.z;',
    '  gl_Position=projectionMatrix*mv;',
    '}'].join('\n'),
  fragmentShader:[
    'uniform vec3 fogColor; uniform float fogNear,fogFar; uniform vec3 uSun;',
    'varying vec3 vC; varying vec3 vN; varying float vFiss; varying float vDist;',
    'void main(){',
    '  float l=0.72+0.5*max(dot(normalize(vN),uSun),0.0);',
    '  vec3 c=vC*l;',
    '  c=mix(c,vec3(0.06,0.05,0.04),clamp(vFiss*1.6,0.0,0.9));',
    '  float fg=smoothstep(fogNear,fogFar,vDist);',
    '  gl_FragColor=vec4(mix(c,fogColor,fg),1.0);',
    '}'].join('\n')});
let groundMesh=null;
function groundYAt(z,elev){
  if(z<SHORE-170) return -8.5;
  if(z<SHORE){ const t=(z-(SHORE-170))/170; return -8.5+8.5*t*t; }
  const t=clamp((z-SHORE)/60,0,1);
  return elev*t*t*(3-2*t);
}
function buildGround(elev,look,rnd){
  if(groundMesh){ world.remove(groundMesh); groundMesh.geometry.dispose(); }
  const Sz=1800,N=150;
  const g=new T.PlaneGeometry(Sz,Sz,N,N); g.rotateX(-Math.PI/2);
  const pos=g.attributes.position,col=[];
  const cSand=new T.Color(0xd9c9a4),cSoil=new T.Color(0x7e8c5a),
        cRoad=new T.Color(0x7b8188),cDark=new T.Color(0x66704a);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    let y=groundYAt(z,elev);
    y+=(Math.sin(x*0.035)*Math.cos(z*0.028))*0.35*(z>SHORE?1:0.2);
    pos.setY(i,y);
    const c=new T.Color();
    if(z<SHORE+10) c.copy(cSand);
    else if(Math.abs(x)<5.5) c.copy(cRoad);
    else if(Math.abs((Math.abs(x)-5.5)%90)<5) c.copy(cRoad);
    else c.copy(cSoil).lerp(cSand,look.pasir*0.5);
    c.lerp(cDark,clamp((y-elev)*0.05,0,0.3));
    const j=0.93+rnd()*0.14; col.push(c.r*j,c.g*j,c.b*j);
  }
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  groundMesh=new T.Mesh(g,groundMat); world.add(groundMesh);
}

/* ================================================================
   AIR — dua lapis:
   1) laut jauh: bidang besar mengikuti mareogram (dinding bore shader)
   2) aliran lokal: SOLVER AIR DANGKAL 2D 96x96 sel (8 m) di atas kota,
      dipaksa di tepi laut oleh mareogram, mengalir MENGELILINGI bangunan,
      menggerakkan puing. Ini air yang benar-benar dihitung.
   ================================================================ */
const wu={uT:{value:0},uSea:{value:0},uLand:{value:0},uBoreZ:{value:-2200},
          uAmp:{value:1},uTurb:{value:0},uBoreH:{value:0},uClip:{value:new T.Vector4(0,0,0,0)},uClipOn:{value:0}};
const farWaterMat=new T.ShaderMaterial({transparent:true,uniforms:wu,
  vertexShader:[
    'uniform float uT,uSea,uLand,uBoreZ,uAmp,uBoreH;',
    'varying vec3 vP; varying float vF;',
    'void main(){',
    '  vec3 p=position;',
    '  float s=1.0/(1.0+exp((p.z-uBoreZ)*0.22));',
    '  float base=mix(uLand,uSea,s);',
    '  float w=sin(p.x*0.075+uT*1.25)*0.16+sin(p.z*0.058-uT*1.0)*0.20',
    '         +sin((p.x+p.z)*0.028+uT*0.62)*0.26+sin((p.x-p.z)*0.013-uT*0.4)*0.34;',
    '  float d=p.z-uBoreZ; float crest=exp(-d*d/420.0);',
    '  vF=clamp(crest*1.5,0.0,1.0);',
    '  p.y=base+w*uAmp+crest*uBoreH; vP=p;',
    '  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);',
    '}'].join('\n'),
  fragmentShader:[
    'uniform float uTurb; uniform vec4 uClip; uniform float uClipOn; varying vec3 vP; varying float vF;',
    'void main(){',
    '  if(uClipOn>0.5 && vP.x>uClip.x && vP.x<uClip.y && vP.z>uClip.z && vP.z<uClip.w) discard;',
    '  vec3 deep=vec3(0.06,0.24,0.34), shal=vec3(0.16,0.48,0.54), mud=vec3(0.34,0.31,0.19);',
    '  vec3 c=mix(deep,shal,clamp((vP.z+500.0)/1100.0,0.0,1.0));',
    '  c=mix(c,mud,clamp(uTurb,0.0,1.0)*0.42);',
    '  c+=vec3(0.05,0.08,0.10)*clamp(vP.y*0.08,0.0,1.0);',
    '  c=mix(c,vec3(0.93,0.95,0.95),clamp(vF*1.1,0.0,1.0));',
    '  gl_FragColor=vec4(c,clamp(0.84+vF*0.16,0.0,1.0));',
    '}'].join('\n')});
{ const g=new T.PlaneGeometry(3600,3600,200,200); g.rotateX(-Math.PI/2);
  const m=new T.Mesh(g,farWaterMat); m.renderOrder=2; scene.add(m); }

/* --- kisi aliran lokal --- */
const LN=96, LDX=8, LX0=-LN*LDX/2, LZ0=SHORE-232;      // z tumbuh ke darat
const FL={h:new Float32Array(LN*LN), eta:new Float32Array(LN*LN),
          M:new Float32Array(LN*LN), N:new Float32Array(LN*LN),
          obst:new Float32Array(LN*LN), active:false, t:0};
const lIdx=(i,j)=>j*LN+i;
function lCell(x,z){ return [Math.floor((x-LX0)/LDX), Math.floor((z-LZ0)/LDX)]; }
function flowInit(elev,sub){
  sub=sub||0;
  for(let j=0;j<LN;j++)for(let i=0;i<LN;i++){
    const z=LZ0+(j+0.5)*LDX; const k=lIdx(i,j);
    FL.h[k]=-(groundYAt(z,elev)-sub); FL.eta[k]=0; FL.M[k]=0; FL.N[k]=0; }
  FL.active=false; FL.t=0;
}
function flowSetObstacle(b,val){          // val: tinggi rintangan efektif (m)
  const [i0,j0]=lCell(b.x-b.w/2,b.z-b.dp/2), [i1,j1]=lCell(b.x+b.w/2,b.z+b.dp/2);
  for(let j=Math.max(0,j0);j<=Math.min(LN-1,j1);j++)for(let i=Math.max(0,i0);i<=Math.min(LN-1,i1);i++)
    FL.obst[lIdx(i,j)]=val;
}
function flowStep(dt,seaLevel){
  const {h,eta,M,N,obst}=FL, EPS=0.02, VMAX=18, MAN2=0.025*0.025;
  // paksa tepi laut
  for(let j=0;j<2;j++)for(let i=0;i<LN;i++){ eta[lIdx(i,j)]=seaLevel; }
  // massa
  for(let j=1;j<LN-1;j++)for(let i=1;i<LN-1;i++){ const k=lIdx(i,j);
    eta[k]-=dt*((M[k]-M[k-1])+(N[k]-N[k-LN]))/LDX; }
  // momentum
  for(let j=1;j<LN-1;j++)for(let i=1;i<LN-1;i++){ const k=lIdx(i,j);
    const hk=h[k]-obst[k], hx=h[k+1]-obst[k+1], hz=h[k+LN]-obst[k+LN];
    let Da=hk+eta[k], Db=hx+eta[k+1], Dd;
    if(Da<=EPS&&Db<=EPS) M[k]=0;
    else{
      if(Da>EPS&&Db<=EPS) Dd=(eta[k]>-hx)?eta[k]+hx:0;
      else if(Db>EPS&&Da<=EPS) Dd=(eta[k+1]>-hk)?eta[k+1]+hk:0;
      else Dd=0.5*(Da+Db);
      if(Dd<=EPS) M[k]=0;
      else{ let m=M[k]-dt*G*Dd*(eta[k+1]-eta[k])/LDX;
        const sp=Math.abs(m)/Dd; if(sp>VMAX) m=Math.sign(m)*VMAX*Dd;
        m/=(1+dt*G*MAN2*Math.abs(m)/(Dd*Dd*Math.cbrt(Dd))); M[k]=m; } }
    let Ea=hk+eta[k], Eb=hz+eta[k+LN], Ed;
    if(Ea<=EPS&&Eb<=EPS) N[k]=0;
    else{
      if(Ea>EPS&&Eb<=EPS) Ed=(eta[k]>-hz)?eta[k]+hz:0;
      else if(Eb>EPS&&Ea<=EPS) Ed=(eta[k+LN]>-hk)?eta[k+LN]+hk:0;
      else Ed=0.5*(Ea+Eb);
      if(Ed<=EPS) N[k]=0;
      else{ let n=N[k]-dt*G*Ed*(eta[k+LN]-eta[k])/LDX;
        const sp=Math.abs(n)/Ed; if(sp>VMAX) n=Math.sign(n)*VMAX*Ed;
        n/=(1+dt*G*MAN2*Math.abs(n)/(Ed*Ed*Math.cbrt(Ed))); N[k]=n; } }
  }
  // peredam di tepi darat & samping
  for(let j=0;j<LN;j++)for(let i=0;i<LN;i++){
    const q=Math.min(i,LN-1-i,LN-1-j); if(q<5){ const f=1-0.06*(5-q)/5; const k=lIdx(i,j);
      M[k]*=f; N[k]*=f; if(j>LN-6) eta[k]=eta[k]*f+seaLevel*(1-f)*0; } }
  FL.t+=dt;
}
function flowAt(x,z){                     // {depth, u, v} pada titik dunia
  const [i,j]=lCell(x,z);
  if(i<1||j<1||i>=LN-1||j>=LN-1) return null;
  const k=lIdx(i,j), D=FL.h[k]-FL.obst[k]+FL.eta[k];
  if(D<=0.03) return {depth:0,u:0,v:0,eta:FL.eta[k]};
  return {depth:D,u:0.5*(FL.M[k]+FL.M[k-1])/D,v:0.5*(FL.N[k]+FL.N[k-LN])/D,eta:FL.eta[k]};
}
/* mesh air dekat, dari kisi aliran */
let nearWater=null, nearPos=null, nearFoam=null;
{
  const g=new T.PlaneGeometry(LN*LDX,LN*LDX,LN-1,LN-1); g.rotateX(-Math.PI/2);
  g.translate(LX0+LN*LDX/2-LDX/2, 0, LZ0+LN*LDX/2-LDX/2);
  nearPos=g.attributes.position;
  nearFoam=new Float32Array(nearPos.count); g.setAttribute('foam',new T.BufferAttribute(nearFoam,1));
  const m=new T.ShaderMaterial({transparent:true,
    uniforms:{uTurb:{value:0.6},fogColor:gU.fogColor,fogNear:gU.fogNear,fogFar:gU.fogFar},
    vertexShader:['attribute float foam; varying float vF; varying float vY; varying float vDist;',
      'void main(){ vF=foam; vY=position.y; vec4 mv=modelViewMatrix*vec4(position,1.0); vDist=-mv.z;',
      ' gl_Position=projectionMatrix*mv; }'].join('\n'),
    fragmentShader:['uniform float uTurb; uniform vec3 fogColor; uniform float fogNear,fogFar;',
      'varying float vF; varying float vY; varying float vDist;',
      'void main(){ vec3 w=vec3(0.14,0.42,0.48), mud=vec3(0.36,0.30,0.18);',
      ' vec3 c=mix(w,mud,uTurb*0.5); c+=vec3(0.06,0.09,0.11)*clamp(vY*0.08,0.0,1.0);',
      ' c=mix(c,vec3(0.94,0.96,0.96),clamp(vF,0.0,1.0));',
      ' float fg=smoothstep(fogNear,fogFar,vDist);',
      ' gl_FragColor=vec4(mix(c,fogColor,fg),0.9); }'].join('\n')});
  nearWater=new T.Mesh(g,m); nearWater.renderOrder=3; nearWater.frustumCulled=false; world.add(nearWater);
}
function nearWaterUpdate(seaLevel,elev){
  const pos=nearPos;
  for(let j=0;j<LN;j++)for(let i=0;i<LN;i++){
    const k=lIdx(i,j), vi=(LN-1-j)*LN+i;        // PlaneGeometry: baris atas = z kecil setelah rotasi? sesuaikan
    const z=LZ0+(j+0.5)*LDX, gy=groundYAt(z,elev);
    let y, foam=0;
    const sub=-world.position.y+0;                        // dunia diturunkan sebesar amblesan
    if(FL.active){
      const D=FL.h[k]-FL.obst[k]+FL.eta[k];
      if(D>0.03){ y=FL.eta[k]+sub;                        // eta relatif MSL -> koordinat dunia
        const u=0.5*(FL.M[k]+(k>0?FL.M[k-1]:0))/D, v=0.5*(FL.N[k]+(k>=LN?FL.N[k-LN]:0))/D;
        foam=clamp((Math.hypot(u,v)-1.5)/6,0,1)*0.9+clamp((0.6-D)/0.6,0,1)*0.4; }
      else y=gy-8;
    } else { y = (seaLevel+sub)>gy+0.05 ? seaLevel+sub : gy-8; }
    pos.setY(k,y); nearFoam[k]=foam;
  }
  pos.needsUpdate=true; nearWater.geometry.attributes.foam.needsUpdate=true;
  nearWater.geometry.computeVertexNormals();
}
/* peta indeks: PlaneGeometry (setelah rotateX(-90)) menyusun titik baris demi baris sepanjang x,
   baris pertama pada z paling negatif? Kita paksa dengan menulis ulang posisi x,z sekali. */
{ for(let j=0;j<LN;j++)for(let i=0;i<LN;i++){ const k=lIdx(i,j);
    nearPos.setX(k,LX0+(i+0.5)*LDX); nearPos.setZ(k,LZ0+(j+0.5)*LDX); nearPos.setY(k,-20); }
  nearPos.needsUpdate=true; }

/* ---------- properti, bangunan, pecahan, debu ---------- */
let props=[], B=[], wallMesh=null, roofMesh=null;
const dummy=new T.Object3D();
function clearProps(){ for(const p of props){ world.remove(p); if(p.geometry&&!p.userData.keep)p.geometry.dispose(); } props=[]; }
function addInstanced(geo,mat,items){
  if(!items.length) return null;
  const m=new T.InstancedMesh(geo,mat,items.length);
  items.forEach((it,i)=>{ dummy.position.set(it.x,it.y,it.z);
    dummy.rotation.set(it.rx||0,it.ry||0,it.rz||0);
    dummy.scale.set(it.sx||1,it.sy||1,it.sz||1); dummy.updateMatrix();
    m.setMatrixAt(i,dummy.matrix); if(it.c) m.setColorAt(i,it.c); });
  m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true;
  m.frustumCulled=false; world.add(m); props.push(m); return m;
}
/* --- pecahan (fragmen) bangunan: benda tegar sederhana --- */
const FRAG_N=2600;
const FR=[]; for(let i=0;i<FRAG_N;i++) FR.push({alive:false,x:0,y:-999,z:0,vx:0,vy:0,vz:0,
  rx:0,ry:0,rz:0,wx:0,wy:0,wz:0,sx:1,sy:1,sz:1,settled:false,age:0});
let fragMesh=null; let fragHead=0;
function fragSpawn(b,count,burst){
  const cols=b.h<6?3:b.h<12?4:6, rows=Math.max(2,Math.round(b.h/3)), per=Math.max(1,Math.round(count/(cols*rows)));
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)for(let q=0;q<per;q++){
    const f=FR[fragHead]; fragHead=(fragHead+1)%FRAG_N;
    f.alive=true; f.settled=false; f.age=0;
    f.sx=b.w/cols*(0.7+Math.random()*0.5); f.sy=b.h/rows*(0.6+Math.random()*0.5); f.sz=b.dp/cols*(0.7+Math.random()*0.5);
    f.x=b.x+(c+0.5-cols/2)*(b.w/cols)+(Math.random()-0.5)*0.5;
    f.y=b.gy+(r+0.5)*(b.h/rows); f.z=b.z+(Math.random()-0.5)*b.dp*0.8;
    const dir=Math.atan2(f.z-b.z,f.x-b.x);
    f.vx=Math.cos(dir)*burst*(0.5+Math.random())+(Math.random()-0.5); f.vz=Math.sin(dir)*burst*(0.5+Math.random())+(Math.random()-0.5);
    f.vy=(Math.random()-0.3)*burst*0.6;
    f.rx=Math.random()*3; f.ry=Math.random()*3; f.rz=Math.random()*3;

function fragUpdate(dt,seaLevel,elev){
  if(!fragMesh) return;
  for(let i=0;i<FRAG_N;i++){ const f=FR[i];
    if(!f.alive){ dummy.position.set(0,-999,0); dummy.scale.set(0.001,0.001,0.001); dummy.rotation.set(0,0,0);
      dummy.updateMatrix(); fragMesh.setMatrixAt(i,dummy.matrix); continue; }
    f.age+=dt;
    const gy=groundYAt(f.z,elev)+f.sy*0.5;
    const fl=FL.active?flowAt(f.x,f.z):null;
    const depth=fl?fl.depth:Math.max(0,seaLevel-groundYAt(f.z,elev));
    if(depth>Math.max(0.5,f.sy*0.8)){                       // terapung & terbawa arus
      const u=fl?fl.u:0, v=fl?fl.v:Math.min(10,2*Math.sqrt(G*depth));
      f.vx+=(u-f.vx)*Math.min(1,dt*0.9); f.vz+=(v-f.vz)*Math.min(1,dt*0.9);
      const surf=(fl?fl.eta:seaLevel)-f.sy*0.3;

      f.rx+=f.wx*dt; f.ry+=f.wy*dt; f.rz+=f.wz*dt;
      if(f.y<gy){ f.y=gy; f.vy=-f.vy*0.12; f.vx*=0.5; f.vz*=0.5; f.wx*=0.4; f.wz*=0.4;
        if(Math.abs(f.vy)<0.6&&Math.hypot(f.vx,f.vz)<0.5&&depth<0.3){ f.settled=true; f.vx=f.vy=f.vz=0; f.wx=f.wy=f.wz=0; } }
    }
    if(Math.abs(f.x)>800||f.z>CAM_Z+500||f.z<LZ0-300) f.alive=false;
    dummy.position.set(f.x,f.y,f.z); dummy.rotation.set(f.rx,f.ry,f.rz);

}

let ruinFrac=0;
function updateBuildings(t,accPeak,seaLevel,elev,dt,sub){
  if(!wallMesh) return;
  let ruin=0;
  for(let i=0;i<B.length;i++){
    const b=B[i];
    // kedalaman di SEKITAR bangunan: muka air solver dikurangi tanah (yang sudah ambles),
    // bukan kedalaman di dalam sel rintangannya sendiri
    const gEff=b.gy-sub;
    let dep=0, spd=0;
    if(FL.active){
      const nb=[flowAt(b.x,b.z-b.dp),flowAt(b.x,b.z+b.dp),flowAt(b.x-b.w,b.z),flowAt(b.x+b.w,b.z)];
      let etaMax=-1e9;
      for(const q of nb) if(q){ if(q.depth>0.03&&q.eta>etaMax) etaMax=q.eta; spd=Math.max(spd,Math.hypot(q.u,q.v)); }
      dep=etaMax>-1e8?Math.max(0,etaMax-gEff):0;
    } else { dep=Math.max(0,seaLevel-gEff); if(dep>0) spd=Math.min(10,2*Math.sqrt(G*dep)); }
    const depEff=dep*(1+0.5*clamp(spd/6,0,1));             // arus deras memperberat
    if(b.st===0){
      if(accPeak>=b.capA){ b.st=1; b.t0=t; fragSpawn(b,b.h<6?10:b.h<12?18:30,2.5);
        dustSpawn(b.x,b.gy+0.5,b.z,10,4); flowSetObstacle(b,Math.min(b.h,6)*0.25); }
      else if(depEff>b.capD){ b.st=3; b.t0=t; fragSpawn(b,b.h<6?8:14,1.2); flowSetObstacle(b,0); }
    } else if(b.st===1){ if(t-b.t0>1.2) b.st=2; }
    else if(b.st===2){ if(depEff>b.capD*0.5){ b.st=3; b.t0=t; fragSpawn(b,6,1.0); flowSetObstacle(b,0); } }
    else if(b.st===3){ if(t-b.t0>1.0) b.st=4; }
    if(b.st>=1) ruin++;
    let vis=(b.st===0)?1:(b.st===1?1-clamp((t-b.t0)/1.2,0,1):0);
    if(b.st===2) vis=0.0;
    if(vis<=0.01){ dummy.position.set(b.x,-999,b.z); dummy.rotation.set(0,0,0); dummy.scale.set(0.001,0.001,0.001); }
    else { const p=1-vis; dummy.position.set(b.x,b.gy+b.h*(1-0.6*p)/2,b.z);
      dummy.rotation.set(b.tilt*p,b.ry,b.twist*p); dummy.scale.set(b.w,b.h*(1-0.6*p),b.dp); }
    dummy.updateMatrix(); wallMesh.setMatrixAt(b.wi,dummy.matrix);
    if(b.ri>=0&&roofMesh){
      if(b.st===0){ dummy.position.set(b.x,b.gy+b.h+1.1,b.z); dummy.rotation.set(0,Math.PI/4,0); dummy.scale.set(b.w*0.82,2.2,b.dp*0.82); }
      else { dummy.position.set(b.x,-999,b.z); dummy.rotation.set(0,0,0); dummy.scale.set(0.001,0.001,0.001); }
      dummy.updateMatrix(); roofMesh.setMatrixAt(b.ri,dummy.matrix);
    }
  }
  wallMesh.instanceMatrix.needsUpdate=true;
  if(roofMesh) roofMesh.instanceMatrix.needsUpdate=true;
  ruinFrac=B.length?ruin/B.length:0;
}

  const sz=inShake?sampleGM(GM.z,tShake):{a:0,d:0};
  const sy=inShake?sampleGM(GM.y,tShake):{a:0,d:0};
  const accG=Math.hypot(sx.a,sz.a)/G;
  const accPeak=inShake?peakGM(GM,tShake):(tShake>=GM.total?peakGM(GM,GM.total):0);
  const sea=seaAt(tSim);
  const dtSim=Math.min(dt*speedNow,0.5);

  /* --- tanah bergeser sungguhan (seluruh dunia lokal), riak, retakan --- */

  world.position.set(sx.d*sway, sy.d*sway*0.7-subNow, sz.d*sway);

  /* --- laut jauh --- */
  const hNear=6+Math.max(0,sea), cBore=Math.sqrt(G*hNear);
  const boreZ=(S.tTiba>0)?clamp(SHORE+(tSim-S.tTiba)*cBore,-2400,2400):-2400;
  const boreH=(S.tTiba>0&&Math.abs(tSim-S.tTiba)<900)?clamp(Math.max(0,sea)*0.55+1.2,0,7):0;

  wu.uTurb.value=clamp((sea-0.3)*0.30,0,1);

  /* --- aliran lokal: aktif di jendela sekitar kedatangan gelombang --- */
  const win=S.tTiba>0 && tSim>S.tTiba-240 && tSim<S.tPuncak+1500;

    for(let j=0;j<LN;j++)for(let i=0;i<LN;i++){ const k=lIdx(i,j), z=LZ0+(j+0.5)*LDX;
      FL.h[k]=-(groundYAt(z,userElev)-subNow); FL.eta[k]=Math.min(sea,0); FL.M[k]=0; FL.N[k]=0; } }
  if(!win&&FL.active){ FL.active=false; }

  wu.uClip.value.set(LX0+LDX*2, LX0+LN*LDX-LDX*2, LZ0+LDX*2, LZ0+LN*LDX-LDX*2);
  if(FL.active){
    flowAcc+=dtSim; const LDT=0.25; let n=0;
    while(flowAcc>=LDT&&n<40){ flowStep(LDT,seaAt(tSim-flowAcc+LDT)); flowAcc-=LDT; n++; }
    if(n>=40) flowAcc=0;
  }
  nearWaterUpdate(sea,userElev);

  const ghCam=groundYAt(CAM_Z,userElev);
  const elevEff=userElev-subNow;                       // tanah sudah turun
  const flCam=FL.active?flowAt(0,CAM_Z):null;
  const depth=flCam?flCam.depth:Math.max(0,sea-elevEff);
  updateBuildings(tSim,accPeak,sea,userElev,dtSim,subNow);
  fragUpdate(Math.min(dtSim,0.06),sea,userElev);
  dustUpdate(Math.min(dtSim,0.06));

  /* --- kamera --- */
  if(camMode==='udara'){
    const orbit=cine?0.42*Math.sin(tSim*0.0011):0;          // ayunan +-24 derajat, selalu di sisi darat
    const hh=Math.max(115,userElev+125), rad=250;
    camera.position.set(Math.sin(orbit)*rad*0.8+sx.d*sway*0.3, hh+sy.d*sway, CAM_Z+Math.cos(orbit)*rad+sz.d*sway*0.3);
    camera.lookAt(0,-2,SHORE-60);
  } else {
    camera.rotation.order='YXZ';
    camera.position.set(4.2+world.position.x, ghCam+1.65+world.position.y, CAM_Z+world.position.z);
    camera.rotation.set(-0.055+clamp(-sz.a/G,-0.3,0.3)*0.5*sway*0.6,
      clamp(sx.a/G,-0.3,0.3)*0.10*sway, clamp(-sx.a/G,-0.3,0.3)*0.40*sway*0.6);
  }

  /* --- suasana: langit gelap saat gempa/tsunami, bawah air --- */
  const under=(camMode==='mata')?depth-1.55:-1;
  const gloom=clamp(Math.max(accG*2.2, boreH/7, depth>0.05?0.6:0),0,1);
  skyU.k.value=gloom;
  const fogC=under>0?FOG_AIR:FOG_UDARA.clone().lerp(FOG_BADAI,gloom*0.45);
  scene.fog.color.copy(fogC); scene.background.copy(fogC); gU.fogColor.value.copy(fogC);
  if(under>0){ scene.fog.near=2; scene.fog.far=clamp(48-under*2.6,14,48); }
  else { scene.fog.near=320-gloom*30; scene.fog.far=2400-gloom*350; }
  gU.fogNear.value=scene.fog.near; gU.fogFar.value=scene.fog.far;

  /* --- suara --- */
  const dBore=Math.abs(boreZ-CAM_Z), near=(S.tTiba>0)?clamp(1-dBore/600,0,1):0;
  const roar=clamp(Math.max(near*clamp(boreH/3,0.2,1.2),depth>0.05?clamp(0.3+depth*0.08,0,1):0),0,1.2);
  const siren=(tSim>tS+S.durasi&&S.tTiba>0&&tSim<S.tTiba+900)?1:0;
  AU.update({accG:accG,depth:depth,roar:roar,siren:siren,tSim:tSim,playing:playing},dt);

  /* --- HUD --- */
  $('#clock').textContent='T + '+hhmmss(tSim);
  $('#phase').textContent=phaseOf(tSim,depth);
  $('#roAcc').innerHTML=nf(accG,3)+' <small>g</small>';
  $('#roRuin').innerHTML=nf(ruinFrac*100)+' <small>%</small>';
  $('#roSea').innerHTML=(sea>=0?'+':'')+nf(sea,2)+' <small>m</small>';
  if(depth>0.02) $('#roDepth').innerHTML='<span style="color:'+(depth>1.5?'var(--crit)':'var(--warn)')+'">'+nf(depth,2)+' <small>m</small></span>';
  else if(sea<elevEff-0.5) $('#roDepth').innerHTML='<span style="color:var(--ok)">'+nf(elevEff-sea,1)+' <small>m di bawahmu</small></span>';
  else $('#roDepth').innerHTML='<span style="color:var(--ok)">kering</span>';
  const dtArr=S.tTiba-tSim;
  $('#roEta').innerHTML=S.tTiba<0?'–':(dtArr>0?nf(dtArr/60)+' <small>mnt lagi</small>':'<span style="color:var(--crit)">sudah datang</span>');
  $('#veil').style.opacity=clamp(Math.max(accG*1.6,under>0?0.4:0),0,0.75)+'';
  $('#alert').style.opacity=(S.tTiba>0&&tSim>=S.tTiba-30&&tSim<S.tPuncak+300)?'1':'0';

  accHist[accI]=sx.a/G; accI=(accI+1)%accHist.length;
  tCtx.clearRect(0,0,tCv.width,tCv.height);
  tCtx.strokeStyle='rgba(120,180,200,.25)'; tCtx.lineWidth=1;
  tCtx.beginPath(); tCtx.moveTo(0,tCv.height/2); tCtx.lineTo(tCv.width,tCv.height/2); tCtx.stroke();
  tCtx.strokeStyle=accG>0.15?'#ff5f4d':(accG>0.05?'#f0a232':'#2ec4d6'); tCtx.lineWidth=2; tCtx.beginPath();
  for(let i=0;i<accHist.length;i++){ const v=accHist[(accI+i)%accHist.length];
    const x=i/(accHist.length-1)*tCv.width, y=tCv.height/2-clamp(v/0.45,-1,1)*(tCv.height/2-2);
    i?tCtx.lineTo(x,y):tCtx.moveTo(x,y); }
  tCtx.stroke();
  $('#scrub').value=Math.round(tSim/TOTAL*1000);
  renderer.render(scene,camera);
}

/* ---------- gelung & sutradara sinematik ---------- */
let seen={shake:false,quiet:false,draw:false,wave:false,under:false,ruin:false,siren:false};
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dtR=Math.min(0.1,(now-lastFrame)/1000); lastFrame=now;
  if(playing){
    const tS=S.rrup/3.6; let sp=speed;
    if(tSim>tS-12&&tSim<tS+S.durasi+16) sp=1;
    else if(S.tTiba>0&&tSim>S.tTiba-150&&tSim<S.tPuncak+480) sp=Math.min(sp,3);
    speedNow=sp; tSim+=dtR*sp;
    if(tSim>TOTAL){ tSim=TOTAL; playing=false; }
    if(!seen.shake&&tSim>=tS){ seen.shake=true;
      banner('gempa','GUNCANGAN GEMPA','MMI '+romOf(S.mmi)+' · '+nf(S.mmi,1)+' · '+nf(S.durasi)+' detik',0);
      caption('Gempa kuat · tanah bergeser, bangunan dan lingkungan berguncang');
      if(cine){ camMode='mata'; setViewBtn(); } }
    if(!seen.ruin&&ruinFrac>0.08){ seen.ruin=true; caption('Bangunan mulai runtuh — '+nf(pRuntuh(S.pga,0)*100)+'% rumah non-rekayasa tak sanggup menahan'); }
    if(!seen.quiet&&tSim>=tS+S.durasi){ seen.quiet=true; $('#banner').hidden=true;
      toast('Guncangan berhenti',nf(ruinFrac*100)+'% bangunan roboh');
      caption(S.tTiba>0?'Guncangan reda · air datang '+nf(Math.max(0,(S.tTiba-tSim))/60)+' menit lagi':'Guncangan reda'); }
    if(!seen.siren&&S.tTiba>0&&tSim>=tS+S.durasi+20){ seen.siren=true;
      banner('siaga','PERINGATAN TSUNAMI','SEGERA EVAKUASI KE TEMPAT TINGGI',9000); }
    if(!seen.draw&&S.tTiba>0&&seaAt(tSim)<-0.5){ seen.draw=true; toast('Laut surut','Tanda tsunami — segera ke tempat tinggi');
      caption('Laut menarik diri · tanda gelombang besar akan datang');
      if(cine){ camMode='udara'; setViewBtn(); } }
    if(!seen.wave&&S.tTiba>0&&tSim>=S.tTiba){ seen.wave=true;
      banner('bahaya','AIR DATANG','SEGERA MENUJU TEMPAT TINGGI',0);
      caption('Gelombang tsunami mulai datang · '+nf(S.puncak,1)+' m di puncaknya');
      if(cine){ camMode='udara'; setViewBtn(); } }
    if(seen.wave&&tSim>S.tPuncak+300&&!$('#banner').hidden&&$('#banner').className.indexOf('bahaya')>=0){ $('#banner').hidden=true; caption('Air belum surut · '+nf(ruinFrac*100)+'% bangunan hancur'); }
    const dep=Math.max(0,seaAt(tSim)-(userElev-Math.abs(S.uz)*clamp((tSim-tS)/S.durasi,0,1)));
    if(!seen.under&&camMode==='mata'&&dep>1.55){ seen.under=true; toast('Kamu tenggelam',nf(dep-1.55,1)+' m air di atas kepala · naikkan ketinggian tempatmu'); }
    if(dep<=1.55) seen.under=false;
  } else speedNow=1;
  if(toastT&&now>toastT){ $('#toast').style.opacity='0'; toastT=0; }
  if(bannerT&&now>bannerT){ $('#banner').hidden=true; bannerT=0; }
  render(dtR);
}
function setViewBtn(){ const b=$('#view'); b.setAttribute('aria-pressed',camMode==='udara');
  b.querySelector('span').textContent=(camMode==='udara')?'Mata':'Udara'; }
function setPlay(v){ playing=v; $('#pause').querySelector('span').textContent=v?'Jeda':(tSim>=TOTAL?'Ulang':'Lanjut'); if(v) AU.resume(); }
function resetAll(){ tSim=0; ruinFrac=0; fissAcc=0; flowAcc=0;
  for(const k in seen) seen[k]=false;
  $('#toast').style.opacity='0'; $('#banner').hidden=true; caption(''); buildTown(S.key,userElev); }
$('#go').addEventListener('click',function(){ $('#intro').remove(); AU.resume(); setPlay(true); caption('Simulasi dimulai · gelombang seismik dalam perjalanan'); });
$('#start').addEventListener('click',function(){ resetAll(); setPlay(true); });
$('#pause').addEventListener('click',function(){ if(tSim>=TOTAL) resetAll(); setPlay(!playing); });
$('#toWave').addEventListener('click',function(){ if(S.tTiba<=0) return;
  tSim=Math.max(0,S.tTiba-100); seen.shake=seen.quiet=seen.draw=seen.siren=true; seen.wave=false; $('#banner').hidden=true; caption('Laut menarik diri · gelombang besar akan datang'); if(cine){camMode='udara';setViewBtn();} setPlay(true); });
$('#view').addEventListener('click',function(){ camMode=(camMode==='mata')?'udara':'mata'; cine=false; $('#cine').setAttribute('aria-pressed','false'); setViewBtn(); render(0.016); });
$('#cine').addEventListener('click',function(e){ cine=!cine; e.currentTarget.setAttribute('aria-pressed',cine); });
$('#more').addEventListener('click',function(e){ const p=$('#panel'), buka=p.hidden; p.hidden=!buka; e.currentTarget.setAttribute('aria-expanded',buka); });
$('#sound').addEventListener('click',function(e){ const on=AU.toggle(); e.currentTarget.setAttribute('aria-pressed',on); e.currentTarget.querySelector('span').textContent=on?'Suara':'Bisu'; });
$('#scrub').addEventListener('input',function(e){ const nt=(+e.target.value)/1000*TOTAL;
  if(nt<tSim){ buildTown(S.key,userElev); ruinFrac=0; fissAcc=0; }
  tSim=nt; seen.shake=seen.quiet=seen.draw=seen.wave=seen.siren=true; $('#banner').hidden=true; render(0.016); });
$('#speed').addEventListener('change',function(e){ speed=+e.target.value; });
$('#elevS').addEventListener('input',function(e){ userElev=+e.target.value; $('#elevV').textContent=nf(userElev)+' m'; buildTown(S.key,userElev); render(0.016); });
$('#swayS').addEventListener('input',function(e){ sway=(+e.target.value)/10; $('#swayV').textContent=nf(sway,1)+'×'; });
$('#site').addEventListener('change',function(e){ for(const k in seen) seen[k]=false; loadSite(e.target.value); setPlay(playing); });
addEventListener('resize',function(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=innerWidth<innerHeight?80:62; camera.updateProjectionMatrix();
  dustPts.material.uniforms.uScale.value=innerHeight*0.9; render(0.016); },{passive:true});

$('#site').innerHTML=D.site.map(function(s){return '<option value="'+s.key+'">'+s.nama+'</option>';}).join('');
window.__STEP=function(dt,opts){            // untuk ekspor video: satu bingkai per panggilan
  opts=opts||{}; playing=false;
  if(opts.cam){ camMode=opts.cam; setViewBtn(); }
  if(opts.t!=null){ if(opts.t<tSim){ buildTown(S.key,userElev); ruinFrac=0; fissAcc=0; flowAcc=0; } tSim=opts.t; }
  const tS=S.rrup/3.6;
  if(!seen.shake&&tSim>=tS){ seen.shake=true; banner('gempa','GUNCANGAN GEMPA','MMI '+romOf(S.mmi)+' · '+nf(S.mmi,1)+' · '+nf(S.durasi)+' detik',0); caption('Gempa kuat · tanah bergeser, bangunan dan lingkungan berguncang'); }
  if(!seen.ruin&&ruinFrac>0.08){ seen.ruin=true; caption('Bangunan mulai runtuh — '+nf(pRuntuh(S.pga,0)*100)+'% rumah non-rekayasa tak sanggup menahan'); }
  if(!seen.quiet&&tSim>=tS+S.durasi){ seen.quiet=true; $('#banner').hidden=true; caption('Guncangan reda · '+nf(ruinFrac*100)+'% bangunan roboh · air datang '+nf(Math.max(0,(S.tTiba-tSim))/60)+' menit lagi'); }
  if(!seen.siren&&S.tTiba>0&&tSim>=tS+S.durasi+20&&tSim<S.tTiba-200){ seen.siren=true; banner('siaga','PERINGATAN TSUNAMI','SEGERA EVAKUASI KE TEMPAT TINGGI',0); }
  if(!seen.draw&&S.tTiba>0&&seaAt(tSim)<-0.5){ seen.draw=true; $('#banner').hidden=true; caption('Laut menarik diri · tanda gelombang besar akan datang'); }
  if(!seen.wave&&S.tTiba>0&&tSim>=S.tTiba){ seen.wave=true; banner('bahaya','AIR DATANG','SEGERA MENUJU TEMPAT TINGGI',0); caption('Gelombang tsunami mulai datang · '+nf(S.puncak,1)+' m di puncaknya'); }
  if(seen.wave&&tSim>S.tPuncak+200){ caption('Air belum surut · '+nf(ruinFrac*100)+'% bangunan hancur'); }
  speedNow=Math.max(0.01,dt/(1/24)); tSim+=dt; render(1/24);
  return {t:tSim,ruin:ruinFrac};
};
window.__SCENE={scene:scene,world:world,camera:camera,nearWater:nearWater,ground:function(){return groundMesh;},frag:function(){return fragMesh;},groundMat:groundMat};
window.__DIAG=function(){ let mn=1e9,mx=-1e9,wet=0,nanN=0; for(let k=0;k<LN*LN;k++){ const e=FL.eta[k];
    if(e!==e){nanN++;continue;} if(e<mn)mn=e; if(e>mx)mx=e; if(FL.h[k]-FL.obst[k]+e>0.03) wet++; }
  let ymn=1e9,ymx=-1e9; for(let k=0;k<nearPos.count;k++){ const y=nearPos.getY(k); if(y<ymn)ymn=y; if(y>ymx)ymx=y; }
  let berdiri=0; for(const b of B) if(b.st===0) berdiri++;
  return {t:Math.round(tSim),aktif:FL.active,etaMin:+mn.toFixed(2),etaMax:+mx.toFixed(2),basah:wet,nan:nanN,
    meshYmin:+ymn.toFixed(1),meshYmax:+ymx.toFixed(1),berdiri:berdiri,dari:B.length,worldY:+world.position.y.toFixed(2)}; };
loadSite('labuan'); $('#site').value='labuan';
$('#load').remove();
loop();
})();
</script>
