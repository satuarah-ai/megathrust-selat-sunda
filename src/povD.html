<script>
(function(){
"use strict";
const D=window.__POV, L=window.__POVLIB;
const {buildGM,sampleGM,peakGM,AU,mulberry32,clamp,nf,romOf,hhmmss,$}=L;
const T=window.THREE;
if(!T){ $('#load').innerHTML='<div><span>Gagal memuat pustaka 3D. Periksa koneksi lalu muat ulang.</span></div>'; return; }
const G=9.80665;

/* ================================================================
   KERENTANAN BANGUNAN
   Guncangan: kurva rapuh lognormal. Tiap bangunan diberi kapasitas
     kapasitas = median * exp(beta * z),  z ~ N(0,1)
   sehingga bagian yang runtuh = P(kapasitas < PGA) = kurva rapuh itu
   sendiri. Median menurut kelas (HAZUS URM/beton, disetel untuk
   bangunan non-rekayasa Indonesia).
   Tsunami: kedalaman aliran perobohan (Koshimura dkk. 2009, Banda Aceh)
   ================================================================ */
const KELAS=[
  {nama:'rumah non-rekayasa', medA:0.38, betA:0.65, medD:2.2, betD:0.45},
  {nama:'ruko 2-3 lantai',    medA:0.46, betA:0.62, medD:3.6, betD:0.42},
  {nama:'beton bertulang',    medA:0.62, betA:0.58, medD:6.5, betD:0.40}
];
function gauss(rnd){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const pRuntuh=(pga,k)=>Phi(Math.log(pga/KELAS[k].medA)/KELAS[k].betA);

const LOOK={
  jakut:        {rumah:250, tinggi:[3.2,7,14,32], palem:26, perahu:4,  pasir:0.18},
  labuan:       {rumah:170, tinggi:[3.2,4.5,7,11],palem:95, perahu:16, pasir:0.85},
  anyer:        {rumah:130, tinggi:[3.2,4.5,8,13],palem:110,perahu:10, pasir:0.9},
  merak:        {rumah:190, tinggi:[3.4,6,11,22], palem:40, perahu:12, pasir:0.35},
  pelabuhanratu:{rumah:140, tinggi:[3.2,5,9,16],  palem:80, perahu:20, pasir:0.7},
  bakauheni:    {rumah:110, tinggi:[3.2,4.5,7,12],palem:85, perahu:14, pasir:0.8},
  seribu:       {rumah:70,  tinggi:[3.2,4,6,8],   palem:130,perahu:18, pasir:1.0},
  cilegon:      {rumah:210, tinggi:[4,8,15,28],   palem:30, perahu:6,  pasir:0.3}
};

/* ---------- penyaji ---------- */
const cv=$('#stage');
const renderer=new T.WebGLRenderer({canvas:cv,antialias:(window.devicePixelRatio||1)<2});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight,false);
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,0.15,3200);
const FOG_UDARA=0x9fb8c4, FOG_AIR=0x24606b;
scene.fog=new T.Fog(FOG_UDARA,320,2400);
scene.background=new T.Color(FOG_UDARA);
{
  const g=new T.SphereGeometry(2600,24,14);
  const m=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,
    uniforms:{a:{value:new T.Color(0x2f5f88)},b:{value:new T.Color(0xb4c8d2)}},
    vertexShader:'varying float vy;void main(){vy=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform vec3 a;uniform vec3 b;varying float vy;void main(){float t=clamp(vy*1.25+0.35,0.0,1.0);gl_FragColor=vec4(mix(b,a,t),1.0);}'});
  scene.add(new T.Mesh(g,m));
}
scene.add(new T.HemisphereLight(0xcfe2ec,0x4a5535,0.85));
const sun=new T.DirectionalLight(0xfff2e0,1.15); sun.position.set(-160,190,120); scene.add(sun);

/* ---------- tanah ---------- */
const SHORE=-40, CAM_Z=110;
let groundMesh=null;
function groundYAt(z,elev){
  if(z<SHORE-170) return -8.5;
  if(z<SHORE){ const t=(z-(SHORE-170))/170; return -8.5+8.5*t*t; }
  const t=clamp((z-SHORE)/60,0,1);
  return elev*t*t*(3-2*t);
}
function buildGround(elev,look,rnd){
  if(groundMesh){ scene.remove(groundMesh); groundMesh.geometry.dispose(); groundMesh.material.dispose(); }
  const Sz=1800,N=120;
  const g=new T.PlaneGeometry(Sz,Sz,N,N); g.rotateX(-Math.PI/2);
  const pos=g.attributes.position,col=[];
  const cSand=new T.Color(0xd9c9a4),cSoil=new T.Color(0x7e8c5a),
        cRoad=new T.Color(0x4a5157),cDark=new T.Color(0x55603f);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    let y=groundYAt(z,elev);
    y+=(Math.sin(x*0.035)*Math.cos(z*0.028))*0.35*(z>SHORE?1:0.2);
    pos.setY(i,y);
    const c=new T.Color();
    if(z<SHORE+10) c.copy(cSand);
    else if(Math.abs(x)<9) c.copy(cRoad);
    else if(Math.abs((Math.abs(x)-9)%90)<6) c.copy(cRoad);
    else c.copy(cSoil).lerp(cSand,look.pasir*0.5);
    c.lerp(cDark,clamp((y-elev)*0.05,0,0.3));
    const j=0.93+rnd()*0.14; col.push(c.r*j,c.g*j,c.b*j);
  }
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  groundMesh=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true}));
  scene.add(groundMesh);
}

/* ---------- air ---------- */
const wu={uT:{value:0},uSea:{value:0},uLand:{value:0},uBoreZ:{value:-2200},
          uAmp:{value:1},uTurb:{value:0},uBoreH:{value:0}};
{
  const g=new T.PlaneGeometry(3600,3600,200,200); g.rotateX(-Math.PI/2);
  const mat=new T.ShaderMaterial({transparent:true,uniforms:wu,
    vertexShader:[
      'uniform float uT,uSea,uLand,uBoreZ,uAmp,uBoreH;',
      'varying vec3 vP; varying float vF;',
      'void main(){',
      '  vec3 p=position;',
      '  float s=1.0/(1.0+exp((p.z-uBoreZ)*0.22));',
      '  float base=mix(uLand,uSea,s);',
      '  float w=sin(p.x*0.075+uT*1.25)*0.16+sin(p.z*0.058-uT*1.0)*0.20',
      '         +sin((p.x+p.z)*0.028+uT*0.62)*0.26+sin((p.x-p.z)*0.013-uT*0.4)*0.34;',
      '  float d=p.z-uBoreZ;',
      '  float crest=exp(-d*d/420.0);',
      '  vF=clamp(crest*1.5,0.0,1.0);',
      '  p.y=base+w*uAmp+crest*uBoreH;',
      '  vP=p;',
      '  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);',
      '}'].join('\n'),
    fragmentShader:[
      'uniform float uTurb; varying vec3 vP; varying float vF;',
      'void main(){',
      '  vec3 deep=vec3(0.06,0.24,0.34), shal=vec3(0.16,0.48,0.54), mud=vec3(0.34,0.31,0.19);',
      '  vec3 c=mix(deep,shal,clamp((vP.z+500.0)/1100.0,0.0,1.0));',
      '  c=mix(c,mud,clamp(uTurb,0.0,1.0)*0.42);',
      '  c+=vec3(0.05,0.08,0.10)*clamp(vP.y*0.08,0.0,1.0);',   // kilau langit di puncak riak
      '  c=mix(c,vec3(0.93,0.95,0.95),clamp(vF*1.1,0.0,1.0));',
      '  gl_FragColor=vec4(c,clamp(0.84+vF*0.16,0.0,1.0));',
      '}'].join('\n')});
  const water=new T.Mesh(g,mat); water.renderOrder=2; scene.add(water);
}

/* ---------- properti, bangunan, puing ---------- */
let props=[], B=[], wallMesh=null, roofMesh=null, debMesh=null, DEB=[];
const dummy=new T.Object3D();
function clearProps(){ for(const p of props){ scene.remove(p); if(p.geometry)p.geometry.dispose(); } props=[]; }
function addInstanced(geo,mat,items){
  if(!items.length) return null;
  const m=new T.InstancedMesh(geo,mat,items.length);
  items.forEach((it,i)=>{ dummy.position.set(it.x,it.y,it.z);
    dummy.rotation.set(it.rx||0,it.ry||0,it.rz||0);
    dummy.scale.set(it.sx||1,it.sy||1,it.sz||1); dummy.updateMatrix();
    m.setMatrixAt(i,dummy.matrix); if(it.c) m.setColorAt(i,it.c); });
  m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true;
  scene.add(m); props.push(m); return m;
}
function buildTown(key,elev){
  clearProps(); B=[]; DEB=[]; wallMesh=roofMesh=debMesh=null;
  const look=LOOK[key]||LOOK.labuan;
  const rnd=mulberry32(key.length*7919+11);
  buildGround(elev,look,rnd);
  const tin=[0xa8483a,0x8c6a4a,0x6f7d7a,0x9aa0a3,0x7a5a46];
  const wl=[0xd8d3c6,0xc9c2b2,0xe2ddd0,0xb9b3a4,0xcfd4d2];
  const walls=[],roofs=[];
  for(let i=0;i<look.rumah;i++){
    const far=rnd();
    const z=SHORE+10+rnd()*500;
    const side=rnd()<0.5?-1:1;
    const x=side*(12+Math.pow(rnd(),0.8)*280);
    const tier=far<0.55?0:far<0.82?1:far<0.95?2:3;
    const h=look.tinggi[tier]*(0.82+rnd()*0.45);
    const w=4+rnd()*7, dp=4+rnd()*8, gy=groundYAt(z,elev);
    const k=h<6?0:(h<12?1:2);
    const b={x,z,w,h,dp,gy,k,ry:(rnd()-0.5)*0.35,
      capA:KELAS[k].medA*Math.exp(KELAS[k].betA*gauss(rnd)),
      capD:KELAS[k].medD*Math.exp(KELAS[k].betD*gauss(rnd)),
      tilt:(rnd()-0.5)*0.9, twist:(rnd()-0.5)*0.7, st:0, t0:0, wi:walls.length, ri:-1};
    B.push(b);
    walls.push({x,y:gy+h/2,z,sx:w,sy:h,sz:dp,ry:b.ry,
      c:new T.Color(wl[(rnd()*wl.length)|0]).multiplyScalar(0.85+rnd()*0.3)});
    if(h<12){ b.ri=roofs.length;
      roofs.push({x,y:gy+h+1.1,z,sx:w*0.82,sy:2.2,sz:dp*0.82,ry:Math.PI/4,
        c:new T.Color(tin[(rnd()*tin.length)|0])}); }
  }
  wallMesh=addInstanced(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({}),walls);
  roofMesh=addInstanced(new T.ConeGeometry(0.78,1,4),new T.MeshLambertMaterial({}),roofs);
  const deb=[];
  for(let i=0;i<150;i++){
    deb.push({x:0,y:-999,z:0,c:new T.Color(wl[(rnd()*wl.length)|0]).multiplyScalar(0.6+rnd()*0.3)});
    DEB.push({alive:false,x:0,y:-999,z:0,vz:0,vx:0,rx:0,ry:0,rz:0,s:1});
  }
  debMesh=addInstanced(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({}),deb);
  { const z=SHORE+95,x=-46,gy=groundYAt(z,elev);
    const body=new T.Mesh(new T.BoxGeometry(16,7,14),new T.MeshLambertMaterial({color:0xe8e4d8}));
    body.position.set(x,gy+3.5,z); scene.add(body); props.push(body);
    const dome=new T.Mesh(new T.SphereGeometry(5,16,10,0,6.2832,0,Math.PI*0.55),
      new T.MeshLambertMaterial({color:0x2f6f63}));
    dome.position.set(x,gy+7,z); scene.add(dome); props.push(dome);
    const min=new T.Mesh(new T.CylinderGeometry(1.1,1.3,17,10),new T.MeshLambertMaterial({color:0xe8e4d8}));
    min.position.set(x+11,gy+8.5,z); scene.add(min); props.push(min);
    const cap=new T.Mesh(new T.ConeGeometry(1.7,3,10),new T.MeshLambertMaterial({color:0x2f6f63}));
    cap.position.set(x+11,gy+18.5,z); scene.add(cap); props.push(cap); }
  const tr=[],fr=[];
  for(let i=0;i<look.palem;i++){
    const z=SHORE-14+rnd()*450, x=(rnd()-0.5)*640;
    const gy=groundYAt(z,elev), h=7+rnd()*7;
    tr.push({x,y:gy+h/2,z,sy:h,rz:(rnd()-0.5)*0.22});
    for(let f=0;f<5;f++) fr.push({x,y:gy+h,z,ry:f*1.256+rnd(),rz:0.95+rnd()*0.3});
  }
  addInstanced(new T.CylinderGeometry(0.22,0.42,1,6),new T.MeshLambertMaterial({color:0x6b5a41}),tr);
  addInstanced(new T.ConeGeometry(0.85,4.6,4,1,true),
    new T.MeshLambertMaterial({color:0x3f6b34,side:T.DoubleSide}),fr);
  const po=[];
  for(let i=0;i<22;i++){ const z=SHORE+18+i*24,x=(i%2?1:-1)*10.5;
    po.push({x,y:groundYAt(z,elev)+4.5,z,sy:9}); }
  addInstanced(new T.CylinderGeometry(0.16,0.2,1,5),new T.MeshLambertMaterial({color:0x8b8478}),po);
  const bo=[];
  for(let i=0;i<look.perahu;i++){ const z=SHORE-25-rnd()*160,x=(rnd()-0.5)*440;
    bo.push({x,y:-0.4,z,sx:1.4+rnd()*0.9,sy:1.2,sz:4+rnd()*4,ry:rnd()*3.14,
      c:new T.Color().setHSL(rnd(),0.55,0.55)}); }
  addInstanced(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({}),bo);
  const pp=[],hd=[];
  for(let i=0;i<26;i++){
    const z=SHORE+20+rnd()*(CAM_Z-38-SHORE), x=(rnd()-0.5)*54;
    if(Math.abs(z-CAM_Z)<11&&Math.abs(x)<4) continue;
    const gy=groundYAt(z,elev);
    pp.push({x,y:gy+0.78,z,ry:rnd()*6.28,c:new T.Color().setHSL(rnd(),0.45,0.42)});
    hd.push({x,y:gy+1.56,z});
  }
  addInstanced(new T.CapsuleGeometry(0.2,1.06,4,8),new T.MeshLambertMaterial({}),pp);
  addInstanced(new T.SphereGeometry(0.12,8,6),new T.MeshLambertMaterial({color:0x8d6a4f}),hd);
  const gy0=groundYAt(CAM_Z-7,elev);
  const pole=new T.Mesh(new T.CylinderGeometry(0.13,0.13,16,8),new T.MeshLambertMaterial({color:0xf2f2f2}));
  pole.position.set(2.6,gy0+8,CAM_Z-7); scene.add(pole); props.push(pole);
  [[1.65,0xff5f4d],[2.5,0xffc800],[5,0xff9100],[10,0xff3020]].forEach(function(a){
    const r=new T.Mesh(new T.BoxGeometry(1.05,0.17,0.17),new T.MeshBasicMaterial({color:a[1]}));
    r.position.set(2.6,gy0+a[0],CAM_Z-7); scene.add(r); props.push(r); });
}

function spawnDebris(b,n){
  let made=0;
  for(let i=0;i<DEB.length&&made<n;i++){
    const d=DEB[i]; if(d.alive) continue;
    d.alive=true;
    d.x=b.x+(Math.random()-0.5)*b.w; d.z=b.z+(Math.random()-0.5)*b.dp;
    d.y=b.gy+0.4+Math.random()*b.h*0.5;
    d.vx=(Math.random()-0.5)*1.2; d.vz=(Math.random()-0.5)*1.2;
    d.rx=Math.random()*3; d.ry=Math.random()*3; d.rz=Math.random()*3;
    d.s=0.6+Math.random()*1.5; made++;
  }
}
function updateDebris(dt,sea,flowV,elev){
  if(!debMesh) return;
  for(let i=0;i<DEB.length;i++){
    const d=DEB[i];
    if(!d.alive){ dummy.position.set(0,-999,0); dummy.rotation.set(0,0,0);
      dummy.scale.set(0.001,0.001,0.001); dummy.updateMatrix(); debMesh.setMatrixAt(i,dummy.matrix); continue; }
    const gh=groundYAt(d.z,elev), dep=sea-gh;
    if(dep>0.3){ d.vz+=(flowV-d.vz)*Math.min(1,dt*0.5); d.y+=((sea-0.2)-d.y)*Math.min(1,dt*1.5);
      d.ry+=dt*0.8; d.rx+=dt*0.5; }
    else { d.vz*=0.92; d.y+=((gh+0.3)-d.y)*Math.min(1,dt*2); }
    d.z+=d.vz*dt; d.x+=d.vx*dt;
    if(d.z>CAM_Z+420||Math.abs(d.x)>700) d.alive=false;
    dummy.position.set(d.x,d.y,d.z); dummy.rotation.set(d.rx,d.ry,d.rz);
    dummy.scale.set(d.s*1.3,d.s*0.45,d.s*1.1); dummy.updateMatrix();
    debMesh.setMatrixAt(i,dummy.matrix);
  }
  debMesh.instanceMatrix.needsUpdate=true;
}

let ruinFrac=0;
function updateBuildings(t,accPeak,sea,elev,flowV,dt){
  if(!wallMesh) return;
  let ruin=0;
  for(let i=0;i<B.length;i++){
    const b=B[i];
    const gh=b.gy, dep=Math.max(0,sea-gh);
    if(b.st===0){
      if(accPeak>=b.capA){ b.st=1; b.t0=t; spawnDebris(b,3); }
      else if(dep>b.capD){ b.st=3; b.t0=t; spawnDebris(b,4); }
    } else if(b.st===1){ if(t-b.t0>1.6) b.st=2; }
    else if(b.st===2){ if(dep>b.capD*0.55){ b.st=3; b.t0=t; spawnDebris(b,3); } }
    else if(b.st===3){ if(t-b.t0>4.5) b.st=4; }
    if(b.st>=1) ruin++;
    let sy=1,ty=0,tx=0,tz=0,dz=0,sc=1,vis=1;
    if(b.st===1){ const p=clamp((t-b.t0)/1.6,0,1);
      sy=1-0.72*p; tx=b.tilt*p; tz=b.twist*p; ty=-b.h*0.36*p; }
    else if(b.st===2){ sy=0.28; tx=b.tilt; tz=b.twist; ty=-b.h*0.36; }
    else if(b.st===3){ const p=clamp((t-b.t0)/4.5,0,1);
      sy=0.28*(1-p*0.8); tx=b.tilt+1.1*p; tz=b.twist+0.8*p;
      ty=-b.h*0.36-p*1.2; dz=p*(14+flowV*1.6); sc=1-p*0.35; vis=1-p; }
    else if(b.st===4){ vis=0; }
    if(vis<=0){ dummy.position.set(b.x,-999,b.z); dummy.rotation.set(0,0,0);
      dummy.scale.set(0.001,0.001,0.001); }
    else { dummy.position.set(b.x,b.gy+b.h*sy/2+ty,b.z+dz);
      dummy.rotation.set(tx,b.ry,tz);
      dummy.scale.set(b.w*sc,b.h*sy,b.dp*sc); }
    dummy.updateMatrix(); wallMesh.setMatrixAt(b.wi,dummy.matrix);
    if(b.ri>=0&&roofMesh){
      if(b.st===0){ dummy.position.set(b.x,b.gy+b.h+1.1,b.z); dummy.rotation.set(0,Math.PI/4,0);
        dummy.scale.set(b.w*0.82,2.2,b.dp*0.82); }
      else { dummy.position.set(b.x,-999,b.z); dummy.rotation.set(0,0,0);
        dummy.scale.set(0.001,0.001,0.001); }
      dummy.updateMatrix(); roofMesh.setMatrixAt(b.ri,dummy.matrix);
    }
  }
  wallMesh.instanceMatrix.needsUpdate=true;
  if(roofMesh) roofMesh.instanceMatrix.needsUpdate=true;
  ruinFrac=B.length?ruin/B.length:0;
  updateDebris(dt,sea,flowV,elev);
}

/* ---------- keadaan ---------- */
let S=null,GM=null,tSim=0,playing=false,speed=60,sway=1.8,userElev=2,camMode='mata',speedNow=1;
let lastFrame=performance.now(),toastT=0;
const accHist=new Float32Array(140); let accI=0;
const tCv=$('#accTrace'),tCtx=tCv.getContext('2d');
const siteByKey=k=>D.site.find(s=>s.key===k)||D.site[0];
function seaAt(t){
  const f=t/D.dtSampel,i=Math.floor(f);
  if(i<0) return 0;
  if(i>=S.ts.length-1) return S.ts[S.ts.length-1]/100;
  const w=f-i; return (S.ts[i]*(1-w)+S.ts[i+1]*w)/100;
}
function loadSite(key){
  S=siteByKey(key); S.seed=1337+key.length*31; GM=buildGM(S);
  userElev=clamp(Math.max(S.elev,0),0,30);
  $('#elevS').value=userElev; $('#elevV').textContent=nf(userElev)+' m';
  buildTown(key,userElev);
  $('#locName').textContent=S.nama;
  $('#locDesc').textContent=S.tempat;
  $('#roMmi').innerHTML=romOf(S.mmi)+' <small>('+nf(S.mmi,1)+')</small>';
  tSim=0; ruinFrac=0;
  $('#introFigs').innerHTML=
   '<div><span class="v">'+romOf(S.mmi)+'</span><span class="k">Intensitas MMI</span></div>'+
   '<div><span class="v">'+nf(S.durasi)+' <small style="font-size:.6em">dtk</small></span><span class="k">Lama guncangan</span></div>'+
   '<div><span class="v">'+nf(pRuntuh(S.pga,0)*100)+' <small style="font-size:.6em">%</small></span><span class="k">Rumah runtuh</span></div>'+
   '<div><span class="v">'+nf(S.puncak,1)+' <small style="font-size:.6em">m</small></span><span class="k">Gelombang</span></div>';
  render(0.016);
}
function toast(a,b){ const el=$('#toast'); el.querySelector('b').textContent=a;
  el.querySelector('span').textContent=b||''; el.style.opacity='1'; toastT=performance.now()+3800; }
const TOTAL=8*3600;
function phaseOf(t,dep){
  const tS=S.rrup/3.6;
  if(t<tS) return 'menunggu';
  if(t<tS+S.durasi) return 'guncangan';
  if(dep>0.05) return 'tergenang';
  if(S.tTiba>0&&t<S.tTiba-180) return 'sesudah guncangan';
  if(S.tTiba>0&&t<S.tTiba) return 'air surut';
  if(t<S.tPuncak+600) return 'air datang';
  return 'sesudahnya';
}

function render(dtReal){
  const dt=dtReal||0.016;
  const tS=S.rrup/3.6, tShake=tSim-tS;
  const inShake=tShake>=0&&tShake<GM.total;
  const sx=inShake?sampleGM(GM.x,tShake):{a:0,d:0};
  const sz=inShake?sampleGM(GM.z,tShake):{a:0,d:0};
  const sy=inShake?sampleGM(GM.y,tShake):{a:0,d:0};
  const accG=Math.hypot(sx.a,sz.a)/G;
  const accPeak=inShake?peakGM(GM,tShake):(tShake>=GM.total?peakGM(GM,GM.total):0);
  const sea=seaAt(tSim);

  const hNear=6+Math.max(0,sea);
  const cBore=Math.sqrt(G*hNear);
  const boreZ=(S.tTiba>0)?clamp(SHORE+(tSim-S.tTiba)*cBore,-2400,2400):-2400;
  const boreH=(S.tTiba>0&&Math.abs(tSim-S.tTiba)<900)?clamp(Math.max(0,sea)*0.55+1.2,0,7):0;
  wu.uT.value=tSim*0.35; wu.uSea.value=sea;
  wu.uLand.value=Math.min(sea,seaAt(Math.max(0,tSim-90)));
  wu.uBoreZ.value=boreZ; wu.uBoreH.value=boreH;
  wu.uAmp.value=clamp(0.8+Math.abs(sea)*0.30,0.6,4.0);
  wu.uTurb.value=clamp((sea-0.3)*0.30,0,1);

  const ghCam=groundYAt(CAM_Z,userElev);
  const depth=Math.max(0,sea-userElev);
  const flowV=Math.min(12,2.0*Math.sqrt(G*Math.max(depth,0)));
  updateBuildings(tSim,accPeak,sea,userElev,flowV,Math.min(dt*speedNow,0.4));

  if(camMode==='udara'){
    const hh=Math.max(120,userElev+130);
    camera.rotation.order='XYZ';
    camera.position.set(sx.d*sway*0.4, hh+sy.d*sway, CAM_Z+255+sz.d*sway*0.4);
    camera.lookAt(0, 0, SHORE-140);
  } else {
    camera.rotation.order='YXZ';
    camera.position.set(sx.d*sway, ghCam+1.65+sy.d*sway*0.7, CAM_Z+sz.d*sway);
    camera.rotation.set(
      -0.055+clamp(-sz.a/G,-0.3,0.3)*0.5*sway*0.6,
      clamp(sx.a/G,-0.3,0.3)*0.10*sway,
      clamp(-sx.a/G,-0.3,0.3)*0.40*sway*0.6);
  }

  const under=(camMode==='mata')?depth-1.55:-1;
  if(under>0){ scene.fog.color.setHex(FOG_AIR); scene.background.setHex(FOG_AIR);
    scene.fog.near=2; scene.fog.far=clamp(48-under*2.6,14,48); }
  else { scene.fog.color.setHex(FOG_UDARA); scene.background.setHex(FOG_UDARA);
    scene.fog.near=320; scene.fog.far=2400; }

  const dBore=Math.abs(boreZ-CAM_Z);
  const near=(S.tTiba>0)?clamp(1-dBore/600,0,1):0;
  const roar=clamp(Math.max(near*clamp(boreH/3,0.2,1.2),depth>0.05?clamp(0.3+depth*0.08,0,1):0),0,1.2);
  const siren=(tSim>tS+S.durasi&&S.tTiba>0&&tSim<S.tTiba+900)?1:0;
  AU.update({accG:accG,depth:depth,roar:roar,siren:siren,tSim:tSim,playing:playing},dt);

  $('#clock').textContent='T + '+hhmmss(tSim);
  $('#phase').textContent=phaseOf(tSim,depth);
  $('#roAcc').innerHTML=nf(accG,3)+' <small>g</small>';
  $('#roRuin').innerHTML=nf(ruinFrac*100)+' <small>%</small>';
  $('#roSea').innerHTML=(sea>=0?'+':'')+nf(sea,2)+' <small>m</small>';
  if(depth>0.02) $('#roDepth').innerHTML='<span style="color:'+(depth>1.5?'var(--crit)':'var(--warn)')+'">'+nf(depth,2)+' <small>m</small></span>';
  else if(sea<userElev-0.5) $('#roDepth').innerHTML='<span style="color:var(--ok)">'+nf(userElev-sea,1)+' <small>m di bawahmu</small></span>';
  else $('#roDepth').innerHTML='<span style="color:var(--ok)">kering</span>';
  const dtArr=S.tTiba-tSim;
  $('#roEta').innerHTML=S.tTiba<0?'–':(dtArr>0?nf(dtArr/60)+' <small>mnt lagi</small>'
    :'<span style="color:var(--crit)">sudah datang</span>');
  $('#veil').style.opacity=clamp(Math.max(accG*1.6,under>0?0.4:0),0,0.75)+'';

  accHist[accI]=sx.a/G; accI=(accI+1)%accHist.length;
  tCtx.clearRect(0,0,tCv.width,tCv.height);
  tCtx.strokeStyle='rgba(120,180,200,.25)'; tCtx.lineWidth=1;
  tCtx.beginPath(); tCtx.moveTo(0,tCv.height/2); tCtx.lineTo(tCv.width,tCv.height/2); tCtx.stroke();
  tCtx.strokeStyle=accG>0.15?'#ff5f4d':(accG>0.05?'#f0a232':'#2ec4d6'); tCtx.lineWidth=2;
  tCtx.beginPath();
  for(let i=0;i<accHist.length;i++){
    const v=accHist[(accI+i)%accHist.length];
    const x=i/(accHist.length-1)*tCv.width;
    const y=tCv.height/2-clamp(v/0.45,-1,1)*(tCv.height/2-2);
    i?tCtx.lineTo(x,y):tCtx.moveTo(x,y);
  }
  tCtx.stroke();
  $('#scrub').value=Math.round(tSim/TOTAL*1000);
  renderer.render(scene,camera);
}

let seenShake=false,seenQuiet=false,seenDraw=false,seenWave=false,seenUnder=false,seenRuin=false;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dtR=Math.min(0.1,(now-lastFrame)/1000); lastFrame=now;
  if(playing){
    const tS=S.rrup/3.6;
    let sp=speed;
    if(tSim>tS-12&&tSim<tS+S.durasi+16) sp=1;
    else if(S.tTiba>0&&tSim>S.tTiba-150&&tSim<S.tPuncak+480) sp=Math.min(sp,3);
    speedNow=sp; tSim+=dtR*sp;
    if(tSim>TOTAL){ tSim=TOTAL; playing=false; }
    if(!seenShake&&tSim>=tS){ seenShake=true; toast('Guncangan dimulai','MMI '+romOf(S.mmi)+' · '+nf(S.durasi)+' detik'); }
    if(!seenRuin&&ruinFrac>0.08){ seenRuin=true;
      toast('Bangunan mulai runtuh',nf(pRuntuh(S.pga,0)*100)+'% rumah non-rekayasa tak sanggup menahan'); }
    if(!seenQuiet&&tSim>=tS+S.durasi){ seenQuiet=true;
      toast('Guncangan berhenti',nf(ruinFrac*100)+'% bangunan roboh'+(S.tTiba>0?' · air datang '+nf(Math.max(0,(S.tTiba-tSim))/60)+' menit lagi':'')); }
    if(!seenDraw&&S.tTiba>0&&seaAt(tSim)<-0.5){ seenDraw=true; toast('Laut surut','Tanda tsunami — segera ke tempat tinggi'); }
    if(!seenWave&&S.tTiba>0&&tSim>=S.tTiba){ seenWave=true; toast('Air datang',nf(S.puncak,1)+' m · puncak menit ke-'+nf(S.tPuncak/60)); }
    const dep=Math.max(0,seaAt(tSim)-userElev);
    if(!seenUnder&&camMode==='mata'&&dep>1.55){ seenUnder=true;
      toast('Kamu tenggelam',nf(dep-1.55,1)+' m air di atas kepala · naikkan ketinggian tempatmu'); }
    if(dep<=1.55) seenUnder=false;
  } else speedNow=1;
  if(toastT&&now>toastT){ $('#toast').style.opacity='0'; toastT=0; }
  render(dtR);
}

function setPlay(v){ playing=v;
  $('#pause').querySelector('span').textContent=v?'Jeda':(tSim>=TOTAL?'Ulang':'Lanjut');
  if(v) AU.resume(); }
function reset(){ tSim=0; ruinFrac=0;
  seenShake=seenQuiet=seenDraw=seenWave=seenUnder=seenRuin=false;
  $('#toast').style.opacity='0'; buildTown(S.key,userElev); }
$('#go').addEventListener('click',function(){ $('#intro').remove(); AU.resume(); setPlay(true); });
$('#start').addEventListener('click',function(){ reset(); setPlay(true); });
$('#pause').addEventListener('click',function(){ if(tSim>=TOTAL) reset(); setPlay(!playing); });
$('#toWave').addEventListener('click',function(){ if(S.tTiba<=0) return;
  tSim=Math.max(0,S.tTiba-100); seenShake=seenQuiet=seenDraw=true; seenWave=false; setPlay(true); });
$('#view').addEventListener('click',function(e){
  camMode=(camMode==='mata')?'udara':'mata';
  const b=e.currentTarget;
  b.setAttribute('aria-pressed',camMode==='udara');
  b.querySelector('span').textContent=(camMode==='udara')?'Mata':'Udara';
  b.title=(camMode==='udara')?'Kembali ke pandangan mata':'Pandangan dari udara';
  render(0.016); });
$('#more').addEventListener('click',function(e){
  const p=$('#panel'), buka=p.hidden;
  p.hidden=!buka; e.currentTarget.setAttribute('aria-expanded',buka); });
$('#sound').addEventListener('click',function(e){ const on=AU.toggle();
  e.currentTarget.setAttribute('aria-pressed',on);
  e.currentTarget.querySelector('span').textContent=on?'Suara':'Bisu';
  e.currentTarget.title=on?'Suara nyala':'Suara mati'; });
$('#scrub').addEventListener('input',function(e){
  const nt=(+e.target.value)/1000*TOTAL;
  if(nt<tSim){ buildTown(S.key,userElev); ruinFrac=0; }
  tSim=nt; seenShake=seenQuiet=seenDraw=seenWave=true; render(0.016); });
$('#speed').addEventListener('change',function(e){ speed=+e.target.value; });
$('#elevS').addEventListener('input',function(e){ userElev=+e.target.value;
  $('#elevV').textContent=nf(userElev)+' m'; buildTown(S.key,userElev); render(0.016); });
$('#swayS').addEventListener('input',function(e){ sway=(+e.target.value)/10;
  $('#swayV').textContent=nf(sway,1)+'×'; });
$('#site').addEventListener('change',function(e){
  seenShake=seenQuiet=seenDraw=seenWave=seenUnder=seenRuin=false;
  loadSite(e.target.value); setPlay(playing); });
addEventListener('resize',function(){ renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); render(0.016); },{passive:true});

$('#site').innerHTML=D.site.map(function(s){return '<option value="'+s.key+'">'+s.nama+'</option>';}).join('');
loadSite('labuan'); $('#site').value='labuan';
$('#load').remove();
loop();
})();
</script>
