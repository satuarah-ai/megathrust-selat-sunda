<title>Rasakan Sendiri — Megathrust Selat Sunda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
<style>
:root{
  --bg:#060f17; --surf:#0d1a24; --surf2:#132531; --surf3:#1c3242;
  --ink:#e7eff4; --ink2:#9cb1be; --ink3:#68808f; --line:#1c303d; --line2:#2b4757;
  --accent:#2ec4d6; --accent2:#63dbe9; --onaccent:#03222a;
  --warn:#f0a232; --crit:#ff5f4d; --ok:#34d399;
  --glass:rgba(6,16,24,.80); --edge:rgba(120,180,200,.26);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:Archivo,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1{margin:0;font-weight:700;letter-spacing:-.03em;text-wrap:balance}

#stage{position:fixed;inset:0;display:block;touch-action:none}
#veil{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%)}

/* ---- kerangka HUD: seluruh ruang tengah tetap milik pemandangan ---- */
.hud{position:fixed;inset:0;pointer-events:none;display:grid;
  grid-template-rows:auto auto 1fr auto;padding:8px;gap:6px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.hud > *{pointer-events:auto}
.spacer{pointer-events:none}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:9px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ---- baris atas ---- */
.topbar{display:flex;gap:6px;align-items:stretch;justify-content:space-between}
.tt{padding:6px 10px;display:grid;gap:1px;min-width:0;flex:1 1 auto}
.tt b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tt span{font-family:IBM Plex Mono,monospace;font-size:9.5px;color:#8fb3c2;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{padding:6px 10px;display:grid;gap:1px;justify-items:end;flex:0 0 auto}
.clock{font-family:IBM Plex Mono,monospace;font-size:14px;font-weight:600;letter-spacing:.02em;
  color:var(--accent2);font-variant-numeric:tabular-nums;white-space:nowrap}
.phase{font-family:IBM Plex Mono,monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:#8fb3c2;white-space:nowrap}

/* ---- strip pembacaan: satu pita tipis, bukan kartu besar ---- */
.strip{padding:6px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.rd{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;min-width:0}
.rd i{font-family:IBM Plex Mono,monospace;font-size:8.5px;letter-spacing:.09em;
  text-transform:uppercase;color:#7f9dab;font-style:normal}
.rd b{font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rd b small{font-size:.62em;font-weight:500;color:#8fb3c2}
#accTrace{display:block;width:120px;height:22px;border-radius:3px;
  background:rgba(10,26,38,.6);margin-left:auto}

/* ---- dok bawah: setipis mungkin ---- */
.dock{display:grid;gap:6px}
.scrub{width:100%;accent-color:var(--accent);height:16px;margin:0;
  background:transparent;cursor:pointer}
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.btn{appearance:none;border:1px solid var(--edge);background:var(--glass);color:var(--ink);
  font:600 12.5px/1.1 Archivo,sans-serif;padding:0 6px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;
  text-decoration:none;min-width:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn svg{flex:0 0 auto}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent2);color:var(--onaccent)}
.btn[aria-pressed=true]:not(.pri),.btn[aria-expanded=true]{border-color:var(--accent);
  color:var(--accent2);background:rgba(46,196,214,.16)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{flex:1 1 auto;padding:0 14px}

/* ---- panel tambahan, tersembunyi sampai diminta ---- */
.panel{display:grid;gap:8px;padding:9px 10px;background:var(--glass);
  border:1px solid var(--edge);border-radius:11px;backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl{display:grid;gap:2px;min-width:0}
.sl label{font-family:IBM Plex Mono,monospace;font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;color:#8fb3c2;display:flex;justify-content:space-between;gap:6px;
  white-space:nowrap;overflow:hidden}
.sl label b{color:var(--accent2);font-weight:600}
.sl input{width:100%;accent-color:var(--accent);height:20px;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.selwrap{position:relative;display:flex;align-items:center;gap:5px;min-width:0;
  border:1px solid var(--edge);background:rgba(14,32,45,.8);border-radius:9px;
  padding-left:8px;color:#8fb3c2;min-height:40px}
.selwrap select{appearance:none;border:0;background:transparent;color:var(--ink);
  font:500 11.5px/1 Archivo,sans-serif;padding:9px 20px 9px 0;cursor:pointer;min-width:0;width:100%}
.selwrap::after{content:"";position:absolute;right:8px;top:50%;width:5px;height:5px;
  pointer-events:none;border-right:1.6px solid #8fb3c2;border-bottom:1.6px solid #8fb3c2;
  transform:translateY(-70%) rotate(45deg)}
.selwrap select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
.opts .btn{min-height:40px;font-size:11.5px;font-weight:500}

/* ---- layar sempit: tombol jadi ikon saja ---- */
@media(max-width:560px){
  .acts .btn span{display:none}
  .acts .btn{padding:0;gap:0;min-height:48px;border-radius:12px}
  .strip{gap:2px 9px;padding:4px 8px}
  .rd{gap:4px}
  .rd b{font-size:11.5px}
  .rd i{font-size:7.5px;letter-spacing:.06em}
  .rd b small{font-size:.6em}
  #accTrace{display:none}
  .tt{padding:5px 9px} .ck{padding:5px 9px}
  .tt span{display:none}
  .opts{grid-template-columns:1fr 1fr}
  .opts .btn.wide{grid-column:1/-1}
}
@media(max-width:400px){
  .hud{padding:6px;gap:5px}
  .tt b{font-size:12.5px}
  .clock{font-size:13px}
  .sliders{grid-template-columns:1fr}
  .acts{gap:4px}
}
@media(max-height:680px){
  .strip .rd:nth-child(n+5){display:none}
  #accTrace{display:none}
}

/* ---- panel pembuka ---- */
#intro{position:fixed;inset:0;z-index:20;background:rgba(4,11,17,.95);
  backdrop-filter:blur(10px);display:grid;place-items:center;padding:18px;overflow-y:auto}
.ibox{max-width:560px;display:grid;gap:14px}
.ibox h1{font-size:clamp(25px,6vw,38px);line-height:1.05}
.ibox p{margin:0;font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;color:var(--ink2)}
.ibox p strong{color:var(--ink);font-weight:500}
.eyebrow{font-family:IBM Plex Mono,monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.grid2 div{background:var(--surf);padding:9px 11px;display:grid;gap:2px}
.grid2 .v{font-family:IBM Plex Mono,monospace;font-size:18px;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.grid2 .k{font-family:IBM Plex Mono,monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.5;font-family:Archivo,sans-serif}
.note a{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---- pesan kejadian ---- */
#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:15;
  pointer-events:none;text-align:center;opacity:0;transition:opacity .35s;padding:0 16px;
  max-width:min(92vw,520px)}
#toast b{display:block;font-size:clamp(20px,5.5vw,32px);font-weight:700;letter-spacing:-.02em;
  text-shadow:0 2px 20px rgba(0,0,0,.95)}
#toast span{display:block;font-family:IBM Plex Mono,monospace;font-size:11.5px;color:#cfe6ef;
  letter-spacing:.06em;margin-top:5px;text-shadow:0 2px 12px rgba(0,0,0,.95)}

#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#060f17}
#load div{display:grid;gap:9px;justify-items:center}
#load span{font-family:IBM Plex Mono,monospace;font-size:11.5px;color:#8fb3c2;letter-spacing:.06em}
.spin{width:26px;height:26px;border:2px solid rgba(120,180,200,.25);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}#veil,#toast{transition:none}}
</style>
