<script>
(function(){
"use strict";
const D=window.__POV;
const $=s=>document.querySelector(s);
const nf=(x,d=0)=>Number(x).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const romOf=m=>ROM[Math.max(1,Math.min(12,Math.round(m)))]||'X+';
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function hhmmss(s){s=Math.max(0,s|0);const h=(s/3600)|0,m=((s%3600)/60)|0,d=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(d).padStart(2,'0');}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================================================================
   1. GERAKAN TANAH SINTETIS
   Deret sinus berfase acak dengan spektrum Kanai–Tajimi (dominan
   periode panjang, khas gempa besar berjarak jauh), diberi selubung
   Jennings–Housner, lalu diskalakan agar puncaknya persis sama
   dengan PGA dan PGV keluaran GMPE di titik itu.
   ================================================================ */
function highpass(x,alpha){
  const y=new Float32Array(x.length); let px=0,py=0;
  for(let i=0;i<x.length;i++){ y[i]=alpha*(py+x[i]-px); px=x[i]; py=y[i]; }
  return y;
}
function synthComponent(pga,pgv,dur,seed,scale){
  const SR=50, dt=1/SR, total=dur+10, n=Math.ceil(total*SR);
  const rnd=mulberry32(seed);
  const fr=[],am=[],ph=[];
  for(let f=0.12;f<6.0;f*=1.10){
    fr.push(f);
    const fg=0.9, zg=0.55, r=f/fg;
    const H=Math.sqrt((1+4*zg*zg*r*r)/(((1-r*r)*(1-r*r))+4*zg*zg*r*r));
    am.push(H/Math.pow(f,0.35));
    ph.push(rnd()*6.283185307);
  }
  const a=new Float32Array(n);
  for(let i=0;i<n;i++){ const t=i*dt; let s=0;
    for(let k=0;k<fr.length;k++) s+=am[k]*Math.sin(6.283185307*fr[k]*t+ph[k]);
    a[i]=s; }
  const t1=Math.max(4,dur*0.15), t2=dur*0.70, tail=Math.max(1,dur-t2);
  for(let i=0;i<n;i++){ const t=i*dt;
    const e = t<t1 ? (t/t1)*(t/t1) : (t<t2 ? 1 : Math.exp(-2.4*(t-t2)/tail));
    a[i]*=e; }
  let mx=0; for(let i=0;i<n;i++){const v=Math.abs(a[i]); if(v>mx)mx=v;}
  const sA=(pga*9.80665*scale)/(mx||1);
  for(let i=0;i<n;i++) a[i]*=sA;
  let v=new Float32Array(n); for(let i=1;i<n;i++) v[i]=v[i-1]+a[i]*dt;
  v=highpass(v,0.995);
  let mv=0; for(let i=0;i<n;i++){const q=Math.abs(v[i]); if(q>mv)mv=q;}
  const sV=((pgv/100)*scale)/(mv||1);
  for(let i=0;i<n;i++) v[i]*=sV;
  let d=new Float32Array(n); for(let i=1;i<n;i++) d[i]=d[i-1]+v[i]*dt;
  d=highpass(d,0.993);
  let md=0; for(let i=0;i<n;i++){const q=Math.abs(d[i]); if(q>md)md=q;}
  return {dt,n,a,v,d,peakD:md,total};
}
function buildGM(s){
  const x=synthComponent(s.pga,s.pgv,s.durasi,s.seed||1337,1.0);
  const z=synthComponent(s.pga,s.pgv,s.durasi,(s.seed||1337)+91,1.0);
  const y=synthComponent(s.pga,s.pgv,s.durasi,(s.seed||1337)+457,0.55);
  return {x,z,y,total:x.total,dt:x.dt,
    peakDisp:Math.max(x.peakD,z.peakD)};
}
function sampleGM(c,t){                 // interpolasi linear
  const f=t/c.dt, i=f|0;
  if(i<0||i>=c.n-1) return {a:0,d:0};
  const w=f-i;
  return {a:c.a[i]*(1-w)+c.a[i+1]*w, d:c.d[i]*(1-w)+c.d[i+1]*w};
}

/* ================================================================
   2. SUARA — seluruhnya disintesis, tanpa berkas audio.
   Kerasnya tiap lapisan digerakkan oleh keadaan fisika yang sama.
   ================================================================ */
const AU={
  ctx:null, on:true, started:false, nodes:null, lastCrack:0, lastGlass:0,
  init(){
    if(this.ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    const c=this.ctx=new AC();
    const master=c.createGain(); master.gain.value=0.0; master.connect(c.destination);
    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-14; comp.ratio.value=6; comp.attack.value=0.004; comp.release.value=0.25;
    comp.connect(master);
    // derau cokelat (energi menumpuk di frekuensi rendah, seperti gemuruh bumi)
    const L=c.sampleRate*5, brown=c.createBuffer(1,L,c.sampleRate), bd=brown.getChannelData(0);
    let last=0;
    for(let i=0;i<L;i++){ const w=Math.random()*2-1; last=(last+0.019*w)/1.019; bd[i]=last*3.4; }
    const W=c.sampleRate*2, white=c.createBuffer(1,W,c.sampleRate), wd=white.getChannelData(0);
    for(let i=0;i<W;i++) wd[i]=Math.random()*2-1;
    this.white=white;
    const loop=(buf,rate)=>{const s=c.createBufferSource();s.buffer=buf;s.loop=true;
      s.playbackRate.value=rate||1;s.start();return s;};
    const g=v=>{const n=c.createGain();n.gain.value=v;return n;};
    const bq=(type,f,Q)=>{const n=c.createBiquadFilter();n.type=type;n.frequency.value=f;
      if(Q!=null)n.Q.value=Q;return n;};
    // --- gemuruh gempa: derau cokelat lolos-rendah 95 Hz ---
    const rumbleG=g(0), rumbleF=bq('lowpass',95,0.9);
    loop(brown,0.85).connect(rumbleF); rumbleF.connect(rumbleG); rumbleG.connect(comp);
    // --- dentum infrasonik 9–14 Hz ---
    const thudG=g(0), thudF=bq('bandpass',11,5);
    loop(brown,0.5).connect(thudF); thudF.connect(thudG); thudG.connect(comp);
    // --- desis bangunan & tanah (frekuensi menengah) ---
    const midG=g(0), midF=bq('bandpass',420,0.8);
    loop(brown,1.6).connect(midF); midF.connect(midG); midG.connect(comp);
    // --- deru tsunami: lolos-rendah yang membuka saat gelombang mendekat ---
    const roarG=g(0), roarF=bq('lowpass',160,0.7);
    loop(brown,1.15).connect(roarF); roarF.connect(roarG); roarG.connect(comp);
    // --- riak air di sekitar kaki ---
    const lapG=g(0), lapF=bq('bandpass',900,0.9);
    loop(white,0.35).connect(lapF); lapF.connect(lapG); lapG.connect(comp);
    // --- sirene peringatan dini ---
    const sirG=g(0), sirO=c.createOscillator(); sirO.type='triangle'; sirO.frequency.value=600;
    const sirSh=bq('lowpass',2200,1);
    sirO.connect(sirSh); sirSh.connect(sirG); sirG.connect(comp); sirO.start();
    this.nodes={master,comp,rumbleG,rumbleF,thudG,midG,midF,roarG,roarF,lapG,sirG,sirO};
    return true;
  },
  resume(){ if(!this.ctx) this.init();
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    this.started=true; this.fade(this.on?1:0); },
  fade(v){ if(!this.nodes) return;
    const t=this.ctx.currentTime;
    this.nodes.master.gain.cancelScheduledValues(t);
    this.nodes.master.gain.setTargetAtTime(v*0.85,t,0.25); },
  toggle(){ this.on=!this.on; this.fade(this.on?1:0); return this.on; },
  // letupan pendek: derak kayu / pecahan kaca
  burst(freq,Q,dur,vol,type){
    if(!this.ctx||!this.on) return;
    const c=this.ctx, s=c.createBufferSource(); s.buffer=this.white;
    s.playbackRate.value=0.6+Math.random()*0.9;
    const f=c.createBiquadFilter(); f.type=type||'bandpass';
    f.frequency.value=freq*(0.75+Math.random()*0.5); f.Q.value=Q;
    const gg=c.createGain(); gg.gain.value=0;
    s.connect(f); f.connect(gg); gg.connect(this.nodes.comp);
    const t=c.currentTime;
    gg.gain.setValueAtTime(0,t);
    gg.gain.linearRampToValueAtTime(vol,t+0.006);
    gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.start(t); s.stop(t+dur+0.05);
  },
  update(st,dtReal){
    if(!this.ctx||!this.nodes||!this.started) return;
    const n=this.nodes, t=this.ctx.currentTime, k=0.06;
    const aG=clamp(st.accG/0.35,0,1.4);          // percepatan ternormalkan
    n.rumbleG.gain.setTargetAtTime(aG*0.55,t,k);
    n.rumbleF.frequency.setTargetAtTime(70+aG*90,t,k);
    n.thudG.gain.setTargetAtTime(aG*0.42,t,k);
    n.midG.gain.setTargetAtTime(aG*0.13,t,k);
    // deru tsunami: menguat saat muka air naik cepat / gelombang dekat
    const roar=clamp(st.roar,0,1);
    n.roarG.gain.setTargetAtTime(roar*0.62,t,0.18);
    n.roarF.frequency.setTargetAtTime(150+roar*roar*1400,t,0.18);
    // riak bila sudah tergenang
    n.lapG.gain.setTargetAtTime(st.depth>0.03?clamp(0.05+st.depth*0.05,0,0.2):0,t,0.3);
    // sirene
    if(st.siren>0){
      const ph=(st.tSim*0.25)%1;
      n.sirO.frequency.setTargetAtTime(520+380*Math.sin(ph*6.283185),t,0.08);
      n.sirG.gain.setTargetAtTime(st.siren*0.085,t,0.2);
    } else n.sirG.gain.setTargetAtTime(0,t,0.4);
    // transien saat percepatan memuncak
    if(this.on && st.accG>0.06 && st.playing){
      const now=performance.now();
      const rate=st.accG*9;                       // letupan per detik
      if(now-this.lastCrack > 1000/Math.max(0.6,rate)){
        this.lastCrack=now;
        this.burst(900+Math.random()*900,7,0.16+Math.random()*0.2,clamp(st.accG*0.5,0.02,0.3));
      }
      if(st.accG>0.16 && now-this.lastGlass>700+Math.random()*1800){
        this.lastGlass=now;
        this.burst(3200+Math.random()*2600,3,0.25,clamp(st.accG*0.35,0.02,0.22),'highpass');
      }
    }
  }
};
window.__POVLIB={synthComponent,buildGM,sampleGM,AU,mulberry32,clamp,nf,romOf,hhmmss,$};
})();
</script>
