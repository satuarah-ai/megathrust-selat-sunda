<title>Megathrust Selat Sunda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap">
<style>
:root{
  --bg:#eef2f5; --surf:#ffffff; --surf2:#e3eaef; --surf3:#d4e0e7;
  --ink:#0b1a25; --ink2:#3c5567; --ink3:#6d8695; --line:#c4d4dd; --line2:#a6bcc8;
  --accent:#0c6f7f; --accent2:#0a5a67; --onaccent:#ffffff;
  --shadow:0 1px 2px rgba(11,26,37,.07), 0 10px 28px -14px rgba(11,26,37,.2);
  --mmi1:#eef3f6; --mmi3:#bfccff; --mmi4:#a0e6ff; --mmi5:#80ffff; --mmi6:#7aff93;
  --mmi7:#ffff00; --mmi8:#ffc800; --mmi9:#ff9100; --mmi10:#ff3020;
  --warn:#b45309; --crit:#a8201a; --ok:#0f7a4f;
  --rail:336px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060f17; --surf:#0d1a24; --surf2:#132531; --surf3:#1c3242;
    --ink:#e7eff4; --ink2:#9cb1be; --ink3:#68808f; --line:#1c303d; --line2:#2b4757;
    --accent:#2ec4d6; --accent2:#63dbe9; --onaccent:#03222a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.75);
    --mmi1:#2a3a44; --warn:#f0a232; --crit:#ff5f4d; --ok:#34d399;
  }
}
:root[data-theme="dark"]{
  --bg:#060f17; --surf:#0d1a24; --surf2:#132531; --surf3:#1c3242;
  --ink:#e7eff4; --ink2:#9cb1be; --ink3:#68808f; --line:#1c303d; --line2:#2b4757;
  --accent:#2ec4d6; --accent2:#63dbe9; --onaccent:#03222a;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -16px rgba(0,0,0,.75);
  --mmi1:#2a3a44; --warn:#f0a232; --crit:#ff5f4d; --ok:#34d399;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(31px,6.4vw,60px);line-height:1.02;font-weight:700;letter-spacing:-.032em}
h2{font-size:clamp(21px,3.2vw,30px);line-height:1.12}
h3{font-size:16.5px}
h4{font-size:13.5px}
p{margin:0}
a{color:var(--accent)}
.mono,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:IBM Plex Mono,ui-monospace,monospace}
.prose{font-family:Newsreader,Georgia,serif;font-size:17.5px;line-height:1.62;color:var(--ink2);max-width:66ch}
.prose strong{color:var(--ink);font-weight:500}
.prose em{color:var(--ink);font-style:italic}
.eyebrow{font-family:IBM Plex Mono,monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);font-weight:500}
section{scroll-margin-top:20px}

/* kepala */
header.top{border-bottom:1px solid var(--line);background:var(--surf)}
.hdr{display:grid;gap:22px;padding-block:34px 28px}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:100px;padding:4px 11px;font-size:11.5px;font-family:IBM Plex Mono,monospace;
  letter-spacing:.04em;color:var(--ink2);background:var(--bg)}
.pill.hot{border-color:var(--crit);color:var(--crit)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.lede{font-family:Newsreader,Georgia,serif;font-size:clamp(17px,2.2vw,21px);line-height:1.5;
  color:var(--ink2);max-width:62ch}
.notice{display:grid;gap:5px;border-left:3px solid var(--warn);background:var(--surf2);
  padding:13px 16px;border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink2);max-width:78ch}
.notice b{color:var(--ink);font-weight:600}

/* angka kunci */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));
  border-top:1px solid var(--line);border-left:1px solid var(--line)}
.fig{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:14px 15px 15px;background:var(--surf);display:flex;flex-direction:column;gap:3px;min-width:0}
.fig .v{font-family:IBM Plex Mono,monospace;font-size:clamp(21px,3.3vw,27px);font-weight:600;
  letter-spacing:-.035em;line-height:1.08;color:var(--ink);font-variant-numeric:tabular-nums}
.fig .v small{font-size:.5em;font-weight:500;color:var(--ink3);letter-spacing:0}
.fig .k{font-size:10.5px;font-family:IBM Plex Mono,monospace;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);line-height:1.35}

/* konsol peta */
.console{display:grid;grid-template-columns:1fr var(--rail);
  border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surf);
  box-shadow:var(--shadow)}
.mapbox{position:relative;background:#05121d;min-width:0}
#map{display:block;width:100%;height:auto;aspect-ratio:684/512;cursor:crosshair;touch-action:manipulation}
.maptop{position:absolute;inset:9px 9px auto 9px;display:flex;justify-content:space-between;
  gap:9px;pointer-events:none;flex-wrap:wrap}
.chip{font-family:IBM Plex Mono,monospace;font-size:12px;background:rgba(4,16,26,.84);
  color:#dff2f7;border:1px solid rgba(120,180,200,.3);border-radius:6px;padding:5px 10px;
  letter-spacing:.03em;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.chip b{color:#63dbe9;font-weight:600}
.legend{position:absolute;left:9px;bottom:9px;background:rgba(4,16,26,.84);
  border:1px solid rgba(120,180,200,.26);border-radius:6px;padding:8px 10px;
  backdrop-filter:blur(6px);pointer-events:none;max-width:min(60%,292px)}
.legend .lt{font-family:IBM Plex Mono,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:#8fb3c2;margin-bottom:6px}
.ramp{height:9px;border-radius:2px;margin-bottom:5px}
.lticks{display:flex;justify-content:space-between;font-family:IBM Plex Mono,monospace;
  font-size:10px;color:#bcd5de;font-variant-numeric:tabular-nums}
.rail{background:var(--surf2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.railhd{padding:10px 13px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font:500 12px/1 Archivo,sans-serif;padding:7px 9px;border-radius:6px;flex:1 1 auto}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onaccent);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.railbody{padding:11px 13px 14px;display:grid;gap:10px;align-content:start;overflow-y:auto;flex:1;min-height:0}
.gauge{display:grid;gap:4px}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gname{font-size:12.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gval{font-family:IBM Plex Mono,monospace;font-size:12px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--surf3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .1s linear;background:var(--accent)}
.transport{grid-column:1/-1;border-top:1px solid var(--line);background:var(--surf);
  padding:11px 14px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);
  font:600 13px/1 Archivo,sans-serif;padding:9px 14px;border-radius:7px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2);color:var(--onaccent)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.scrub{flex:1 1 200px;min-width:130px;accent-color:var(--accent);height:22px}
.tstat{font-family:IBM Plex Mono,monospace;font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:900px){.console{grid-template-columns:1fr}.rail{border-left:0;border-top:1px solid var(--line)}.railbody{max-height:300px}}

/* blok umum */
.band{padding-block:44px}
.band+.band{border-top:1px solid var(--line)}
.h2row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.cols{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;min-width:0}
.panel.flat{background:transparent;border:0;padding:0}

/* tabel */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:660px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;
  font-variant-numeric:tabular-nums}
th{font-family:IBM Plex Mono,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);font-weight:500;position:sticky;top:0;background:var(--surf2);text-align:right}
th:first-child,td:first-child{text-align:left;font-weight:500;white-space:normal;min-width:132px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surf2)}
tfoot td{font-weight:600;background:var(--surf2);border-top:2px solid var(--line2)}
.mmibadge{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:2px 6px;
  font-family:IBM Plex Mono,monospace;font-size:11.5px;font-weight:600;color:#14202a}
.sev{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* garis waktu */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tlrow{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:13px 0 13px 18px;position:relative;
  border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:0}
.tlrow::before{content:"";position:absolute;left:-6px;top:19px;width:10px;height:10px;border-radius:50%;
  background:var(--surf);border:2px solid var(--line2)}
.tlrow.key::before{background:var(--crit);border-color:var(--crit)}
.tlrow.jkt::before{background:var(--accent);border-color:var(--accent)}
.tlt{font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:600;color:var(--accent);
  letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tld{font-size:14px;color:var(--ink2)}
.tld b{color:var(--ink);font-weight:600}

/* genangan jakarta */
.floodbox{display:grid;gap:14px}
#flood{display:block;width:100%;height:auto;aspect-ratio:455/273;border-radius:8px;background:#05121d;border:1px solid var(--line)}
.slider{display:grid;gap:7px}
.slider input{width:100%;accent-color:var(--accent);height:22px}
.slrow{display:flex;justify-content:space-between;font-family:IBM Plex Mono,monospace;font-size:11.5px;color:var(--ink3)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi div{background:var(--surf);padding:11px 12px;display:grid;gap:2px;min-width:0}
.kpi .v{font-family:IBM Plex Mono,monospace;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .k{font-size:10.5px;font-family:IBM Plex Mono,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

/* grafik */
.chart{width:100%;height:auto;display:block}
.ckey{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.ckey span{display:inline-flex;align-items:center;gap:6px}
.ckey i{width:12px;height:3px;border-radius:2px;display:inline-block}

/* validasi */
.vgrid{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 13px;
  background:var(--surf);border:1px solid var(--line);border-radius:8px}
.vrow .vt{display:grid;gap:2px;min-width:0}
.vrow .vn{font-size:13.5px;font-weight:500;color:var(--ink)}
.vrow .vd{font-size:12px;color:var(--ink3);font-family:IBM Plex Mono,monospace}
.verdict{font-family:IBM Plex Mono,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;font-weight:600;white-space:nowrap}
.verdict.pass{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.verdict.part{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}

footer{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--ink3);font-size:12.5px}
footer a{color:var(--ink2)}
.srcs{display:grid;gap:5px;font-family:IBM Plex Mono,monospace;font-size:11.5px;line-height:1.6}

/* --- lapisan muat --- */
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#05121d;z-index:2}
.lwrap{display:grid;gap:9px;justify-items:center;width:min(78%,280px)}
.lbar{width:100%;height:4px;border-radius:2px;background:rgba(120,180,200,.2);overflow:hidden}
.lbar i{display:block;height:100%;width:0%;background:#2ec4d6;border-radius:2px;transition:width .2s ease}
#lmsg{font-family:IBM Plex Mono,monospace;font-size:11.5px;color:#8fb3c2;letter-spacing:.04em;text-align:center}
/* --- pemilih mutu --- */
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);
  font:500 12.5px/1 Archivo,sans-serif;padding:9px 28px 9px 12px;border-radius:7px;cursor:pointer;min-height:38px}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;pointer-events:none;
  border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:translateY(-70%) rotate(45deg)}
.sel select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* --- penyesuaian layar kecil: target sentuh besar, tak ada yang meleyot --- */
@media(max-width:640px){
  body{font-size:14.5px}
  .wrap{padding-inline:16px}
  .band{padding-block:34px}
  .prose{font-size:16.5px}
  .figs{grid-template-columns:repeat(2,1fr)}
  .fig{padding:12px 13px 13px}
  .seg{width:100%}
  .seg button{flex:1 1 30%;min-height:40px;padding:9px 6px;font-size:12.5px}
  .btn{min-height:42px;padding:10px 15px;flex:1 1 auto;justify-content:center}
  .transport{gap:9px;padding:10px 12px}
  .scrub{flex:1 1 100%;order:5;height:30px}
  .tstat{order:6;flex:1 1 100%}
  .sel{flex:1 1 100%}
  .sel select{width:100%;min-height:42px}
  .railbody{max-height:260px}
  .tlrow{grid-template-columns:1fr;gap:3px;padding:11px 0 11px 16px}
  .tlrow::before{top:15px}
  .kpi{grid-template-columns:repeat(2,1fr)}
  .vrow{grid-template-columns:1fr;gap:7px;align-items:start}
  .verdict{justify-self:start}
  table{font-size:12.5px;min-width:620px}
  th,td{padding:8px 9px}
  th:first-child,td:first-child{min-width:112px}
  .tblwrap{position:relative}
}
@media(max-width:400px){ .figs{grid-template-columns:1fr 1fr} .seg button{flex:1 1 45%} }
/* geser tabel ke samping: beri isyarat, jangan sampai badan halaman ikut geser */
.tblwrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
